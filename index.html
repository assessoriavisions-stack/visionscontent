              <h2>Branding</h2>
              <div><label htmlFor="b-pos">Posicionamento</label><textarea id="b-pos" rows="2" value={b.posicionamento} onChange={mudarB('posicionamento')} /></div>
              <div><label htmlFor="b-prom">Promessa</label><textarea id="b-prom" rows="2" value={b.promessa} onChange={mudarB('promessa')} /></div>
              <div><label htmlFor="b-pers">Personalidade</label><input id="b-pers" value={b.personalidade} onChange={mudarB('personalidade')} /></div>
              <div><label htmlFor="b-val">Valores</label><Etiquetas id="b-val" valor={b.valores} max={15} placeholder="Ex.: ingrediente de verdade" onChange={(v) => setE({ ...e, branding: { ...b, valores: v } })} /></div>
              <div><label htmlFor="b-nao">A marca não faz / não fala</label><Etiquetas id="b-nao" valor={b.naoFazer} max={20} placeholder="Ex.: prometer prazo que não cumpre" onChange={(v) => setE({ ...e, branding: { ...b, naoFazer: v } })} /></div>
            </div></section>

            <section className="cartao"><div className="cartao-corpo stack">
              <h2>Editorias</h2>
              {e.editorias.map((x, i) => (
                <div className="produto" key={i}>
                  <div className="entre"><span className="sobretitulo">Editoria {i + 1}</span><button type="button" className="btn texto peq" onClick={() => setE({ ...e, editorias: e.editorias.filter((_, j) => j !== i) })}>Remover</button></div>
                  <div className="duas">
                    <div><label>Nome</label><input value={x.nome} onChange={(ev) => setE({ ...e, editorias: e.editorias.map((y, j) => (j === i ? { ...y, nome: ev.target.value } : y)) })} /></div>
                    <div><label>Pilar</label>
                      <select value={x.pilar || ''} onChange={(ev) => setE({ ...e, editorias: e.editorias.map((y, j) => (j === i ? { ...y, pilar: ev.target.value } : y)) })}>
                        <option value="">Qualquer</option><option value="P1">P1 · Atração</option><option value="P2">P2 · Venda</option><option value="P3">P3 · Fidelização</option>
                      </select>
                    </div>
                  </div>
                  <div><label>Descrição</label><input value={x.descricao || ''} onChange={(ev) => setE({ ...e, editorias: e.editorias.map((y, j) => (j === i ? { ...y, descricao: ev.target.value } : y)) })} /></div>
                </div>
              ))}
              {e.editorias.length < 20 && <button type="button" className="btn" onClick={() => setE({ ...e, editorias: [...e.editorias, { nome: '', descricao: '', pilar: '' }] })}>Adicionar editoria</button>}
            </div></section>

            <section className="cartao"><div className="cartao-corpo stack">
              <h2>Formatos prioritários</h2>
              <div className="chips">
                {Object.entries(FORMATOS).map(([id, nome]) => {
                  const on = e.formatosPrioritarios.includes(id);
                  return <button type="button" key={id} className={'chip-escolha' + (on ? ' ativo' : '')} aria-pressed={on}
                    onClick={() => setE({ ...e, formatosPrioritarios: on ? e.formatosPrioritarios.filter((f) => f !== id) : [...e.formatosPrioritarios, id] })}>{nome}</button>;
                })}
              </div>
              <div><label htmlFor="obs-f">Observação sobre formatos</label><input id="obs-f" placeholder="Ex.: reels 3x por semana, talking head na cozinha" value={e.observacaoFormatos} onChange={(ev) => setE({ ...e, observacaoFormatos: ev.target.value })} /></div>
            </div></section>

            <section className="cartao"><div className="cartao-corpo stack">
              <h2>Produtos</h2>
              <p className="suave peq">Os mesmos do perfil do cliente. O que você mudar aqui aparece para ele também.</p>
              {sugeridos && (
                <div className="aviso stack">
                  <span>A IA encontrou {sugeridos.length} produto(s) no plano: {sugeridos.map((p) => p.nome).join(', ')}.</span>
                  <div className="linha">
                    <button className="btn mini" onClick={() => { setProd({ produtos: sugeridos }); setSugeridos(null); }}>Usar estes</button>
                    <button className="btn mini" onClick={() => { setProd({ produtos: [...limparProdutos(prod.produtos), ...sugeridos] }); setSugeridos(null); }}>Somar aos atuais</button>
                    <button className="btn mini fantasma" onClick={() => setSugeridos(null)}>Ignorar</button>
                  </div>
                </div>
              )}
              <CamposProdutos d={prod} set={setProd} />
            </div></section>

            <section className="cartao"><div className="cartao-corpo stack">
              <div className="entre"><h2>Foco de {nomeDoMesRef(mesReferencia())}</h2><button className="btn mini" onClick={() => setTela('foco')}>{foco ? 'Editar' : 'Definir'}</button></div>
              {foco === null && <p className="suave">O cliente ainda não definiu o foco deste mês.</p>}
              {foco && <p className="suave">{[foco.produtoFoco, foco.objetivo].filter(Boolean).join(' · ')}{fc ? ` · Campanha: ${fc.nome}` : ''}</p>}
            </div></section>

            {erro && <div className="erro" role="alert">{erro}</div>}
            <div className="barra-acoes">
              <button className="btn" onClick={onVoltar} disabled={salvando}>Cancelar</button>
              <button className="btn primario" onClick={salvar} disabled={salvando}>{salvando ? <><span className="girando" /> Salvando...</> : 'Salvar estratégia'}</button>
            </div>
          </main>
        </>
      );
    }

    // ==========================================================
    // Fase 5: postado, métricas e diagnóstico
    // ==========================================================
    const AJUDA = {
      alcance: 'No post, toque em "Ver insights". É o número de "Contas alcançadas".',
      visualizacoes: 'Nos insights do reel, "Visualizações" (ou "Reproduções").',
      retencao3s: 'Nos insights do reel, veja a "Taxa de pulo". Retenção nos 3s = 100 menos a taxa de pulo. Ex.: taxa de pulo 60% = retenção 40.',
      tempoMedioSeg: 'Nos insights do reel, "Tempo médio de visualização", em segundos.',
      duracaoSeg: 'A duração do vídeo publicado, em segundos.',
      segundoQueda: 'No gráfico de retenção dos insights, o segundo em que a linha cai mais forte. Opcional, mas ajuda muito o diagnóstico.',
      curtidas: 'Nos insights, em "Interações": curtidas.',
      comentarios: 'Nos insights, em "Interações": comentários.',
      compartilhamentos: 'Nos insights, em "Interações": compartilhamentos (o ícone de avião de papel).',
      salvamentos: 'Nos insights, em "Interações": salvamentos.',
      seguidoresGanhos: 'Nos insights, em "Seguidores": quantos começaram a te seguir por causa deste post.',
      visitasPerfil: 'Nos insights, em "Atividade do perfil": visitas ao perfil.',
      mensagens: 'Quantas mensagens ou cliques no link chegaram por causa deste post. Nos insights: "Atividade do perfil" (toques em botões e links), mais as mensagens que citaram o post.',
      leads: 'Quantas conversas de interessados chegaram por causa deste post (direct, WhatsApp, formulário).',
      vendas: 'Quantas dessas conversas viraram venda. Opcional.',
      frame: 'Abra o story, deslize para cima e veja os números de cada frame: contas alcançadas, avançar, sair, respostas, toques no link e votos da enquete ou respostas da caixinha.',
      variantes: 'Para cada Reel de teste, abra os insights: visualizações e retenção nos 3s (100 menos a taxa de pulo).',
    };
    const NOMES_METRICA = {
      alcance: 'Alcance', visualizacoes: 'Visualizações', retencao3s: 'Retenção nos 3s (%)', tempoMedioSeg: 'Tempo médio assistido (s)', duracaoSeg: 'Duração do vídeo (s)',
      segundoQueda: 'Segundo em que a visualização caiu', curtidas: 'Curtidas', comentarios: 'Comentários', compartilhamentos: 'Compartilhamentos', salvamentos: 'Salvamentos',
      seguidoresGanhos: 'Seguidores ganhos', visitasPerfil: 'Visitas ao perfil', mensagens: 'Mensagens / cliques gerados', leads: 'Conversas de interessados (leads)', vendas: 'Vendas',
    };
    const CAMPOS_METRICA = {
      video: ['alcance', 'visualizacoes', 'retencao3s', 'tempoMedioSeg', 'duracaoSeg', 'segundoQueda', 'curtidas', 'comentarios', 'compartilhamentos', 'salvamentos', 'seguidoresGanhos', 'mensagens'],
      estatico: ['alcance', 'curtidas', 'comentarios', 'compartilhamentos', 'salvamentos', 'seguidoresGanhos', 'visitasPerfil', 'mensagens'],
    };
    const OBRIGATORIAS = { video: ['alcance', 'retencao3s', 'tempoMedioSeg', 'duracaoSeg'], estatico: ['alcance'] };
    const CAMPOS_FRAME = [['alcance', 'Alcance'], ['avancos', 'Avançar'], ['saidas', 'Sair'], ['respostas', 'Respostas'], ['toquesLink', 'Toques no link'], ['interacoes', 'Votos / respostas da interação']];
    const ehVideo = (f) => f === 'reels' || f === 'serie';

    function Ajuda({ texto }) {
      const [aberta, setAberta] = useState(false);
      return (
        <>
          <button type="button" className="ajuda" aria-label="Onde acho esse número?" aria-expanded={aberta} onClick={() => setAberta(!aberta)}>?</button>
          {aberta && <span className="ajuda-texto">{texto}</span>}
        </>
      );
    }

    function CampoNumero({ id, nome, valor, onChange, ajuda, obrigatorio }) {
      return (
        <div className="campo-metrica">
          <label htmlFor={id}>{nome}{!obrigatorio && <span className="suave"> (opcional)</span>} {ajuda && <Ajuda texto={ajuda} />}</label>
          <input id={id} type="number" inputMode="decimal" min="0" value={valor ?? ''} onChange={(e) => onChange(e.target.value)} />
        </div>
      );
    }

    function MarcarPostado({ r, onFechar, onPostado }) {
      const agoraLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
      const [link, setLink] = useState('');
      const [quando, setQuando] = useState(agoraLocal());
      const [testados, setTestados] = useState([1]);
      const [erro, setErro] = useState('');
      const [salvando, setSalvando] = useState(false);
      const ganchos = r.conteudo?.ganchos || [];
      const comTeste = ehVideo(r.formato) && ganchos.length > 1;
      async function salvar() {
        setErro('');
        setSalvando(true);
        try {
          const res = await chamar('marcarPostado', { roteiroId: r.id, linkPost: link, postadoEm: new Date(quando).toISOString(), ganchosTestados: comTeste ? testados : [] });
          onPostado(res.postId);
        } catch (e) {
          setErro(mensagemErro(e));
          setSalvando(false);
        }
      }
      return (
        <Modal titulo="Marcar como postado" sobretitulo={r.tema} onFechar={onFechar}>
          <div>
            <label htmlFor="link-post">Link do post <span className="suave">(opcional)</span></label>
            <input id="link-post" placeholder="https://www.instagram.com/reel/..." value={link} onChange={(e) => setLink(e.target.value)} />
          </div>
          <div>
            <label htmlFor="quando">Quando foi ao ar</label>
            <input id="quando" type="datetime-local" value={quando} onChange={(e) => setQuando(e.target.value)} />
          </div>
          {comTeste && (
            <div>
              <label>Quais ganchos você publicou como Reels de teste?</label>
              <div className="chips">
                {ganchos.map((g) => {
                  const on = testados.includes(g.n);
                  return <button type="button" key={g.n} className={'chip-escolha' + (on ? ' ativo' : '')} aria-pressed={on}
                    onClick={() => setTestados(on ? testados.filter((x) => x !== g.n) : [...testados, g.n].sort())}>Gancho {g.n}</button>;
                })}
              </div>
              <p className="dica">Marque todos os que foram ao ar. Na hora das métricas você informa os números de cada um e a plataforma aponta o vencedor.</p>
            </div>
          )}
          <p className="suave peq">{['story_unico', 'sequencia_stories'].includes(r.formato) ? 'Em 20 horas a plataforma te lembra de anotar os números, antes do story sumir.' : 'A plataforma te lembra de anotar os números em 2 dias e em 7 dias.'}</p>
          {erro && <div className="erro" role="alert">{erro}</div>}
          <button className="btn primario cheio" onClick={salvar} disabled={salvando}>{salvando ? <><span className="girando" /> Salvando...</> : 'Confirmar'}</button>
        </Modal>
      );
    }

    function FormMetricas({ uid, post, onVoltar, onSalvo }) {
      const tipo = ehVideo(post.formato) ? 'video' : 'estatico';
      const story = ['story_unico', 'sequencia_stories'].includes(post.formato);
      const m0 = post.metricas || {};
      const [m, setM] = useState(() => ({
        ...m0,
        frames: m0.frames || Array.from({ length: post.totalFrames || 1 }, () => ({})),
        variantes: (post.ganchosTestados || []).map((g) => ({ n: g.n, ...((m0.variantes || []).find((v) => v.n === g.n) || {}) })),
      }));
      const [erro, setErro] = useState('');
      const [salvando, setSalvando] = useState(false);
      const num = (v) => (v === '' || v === null || v === undefined ? null : Number(v));

      async function salvar() {
        setErro('');
        if (!story) {
          const falta = OBRIGATORIAS[tipo].filter((c) => num(m[c]) === null);
          if (falta.length) return setErro(`Preencha: ${falta.map((c) => NOMES_METRICA[c]).join(', ')}.`);
        } else if (num(m.frames[0]?.alcance) === null) return setErro('Preencha pelo menos o alcance do primeiro frame.');
        setSalvando(true);
        try {
          const enviar = story
            ? { frames: m.frames.map((f) => Object.fromEntries(CAMPOS_FRAME.map(([k]) => [k, num(f[k])]))), mensagens: num(m.mensagens), leads: num(m.leads), vendas: num(m.vendas) }
            : { ...Object.fromEntries([...CAMPOS_METRICA[tipo], 'leads', 'vendas'].map((c) => [c, num(m[c])])), variantes: m.variantes.map((v) => ({ n: v.n, visualizacoes: num(v.visualizacoes), retencao3s: num(v.retencao3s) })) };
          await chamar('salvarMetricas', { postId: post.id, metricas: enviar }, { timeout: 180000 });
          toast('Pronto! Aqui está o seu diagnóstico.');
          onSalvo();
        } catch (e) {
          setErro(mensagemErro(e));
        }
        setSalvando(false);
      }

      return (
        <>
          <Cabecalho><button className="btn fantasma mini" onClick={onVoltar}>Voltar</button></Cabecalho>
          <main className="wrap conteudo estreito stack-lg">
            <div className="stack">
              <span className="sobretitulo">{FORMATOS[post.formato]} · {post.pilar}</span>
              <h1>Como foi o post?</h1>
              <p className="suave">"{post.tema}". Leva 1 minuto. Toque no <span className="ajuda" style={{ display: 'inline-grid' }}>?</span> para ver onde achar cada número no Instagram.</p>
            </div>
            {!story && (
              <section className="cartao"><div className="cartao-corpo grade-metricas">
                {CAMPOS_METRICA[tipo].map((c) => (
                  <CampoNumero key={c} id={`m-${c}`} nome={NOMES_METRICA[c]} valor={m[c]} ajuda={AJUDA[c]} obrigatorio={OBRIGATORIAS[tipo].includes(c)} onChange={(v) => setM({ ...m, [c]: v })} />
                ))}
              </div></section>
            )}
            {!story && m.variantes.length >= 2 && (
              <section className="cartao"><div className="cartao-corpo stack">
                <div className="entre"><h2>Reels de teste</h2><Ajuda texto={AJUDA.variantes} /></div>
                {m.variantes.map((v, i) => {
                  const g = post.ganchosTestados.find((x) => x.n === v.n);
                  const muda = (k) => (val) => setM({ ...m, variantes: m.variantes.map((x, j) => (j === i ? { ...x, [k]: val } : x)) });
                  return (
                    <div className="produto" key={v.n}>
                      <span className="sobretitulo">Gancho {v.n}</span>
                      <p className="peq">{g?.texto}</p>
                      <div className="duas">
                        <CampoNumero id={`v-${v.n}-vis`} nome="Visualizações" valor={v.visualizacoes} onChange={muda('visualizacoes')} obrigatorio />
                        <CampoNumero id={`v-${v.n}-ret`} nome="Retenção nos 3s (%)" valor={v.retencao3s} onChange={muda('retencao3s')} obrigatorio />
                      </div>
                    </div>
                  );
                })}
              </div></section>
            )}
            {story && (
              <section className="cartao"><div className="cartao-corpo stack">
                <div className="entre"><h2>Números de cada frame</h2><Ajuda texto={AJUDA.frame} /></div>
                {m.frames.map((f, i) => (
                  <div className="produto" key={i}>
                    <div className="entre"><span className="sobretitulo">Frame {i + 1}</span>{m.frames.length > 1 && <button type="button" className="btn texto peq" onClick={() => setM({ ...m, frames: m.frames.filter((_, j) => j !== i) })}>Remover</button>}</div>
                    <div className="grade-metricas">
                      {CAMPOS_FRAME.map(([k, nome]) => (
                        <CampoNumero key={k} id={`f-${i}-${k}`} nome={nome} valor={f[k]} obrigatorio={k === 'alcance'} onChange={(v) => setM({ ...m, frames: m.frames.map((x, j) => (j === i ? { ...x, [k]: v } : x)) })} />
                      ))}
                    </div>
                  </div>
                ))}
                {m.frames.length < 10 && <button type="button" className="btn" onClick={() => setM({ ...m, frames: [...m.frames, {}] })}>Adicionar frame</button>}
                <CampoNumero id="m-msg" nome={NOMES_METRICA.mensagens} valor={m.mensagens} ajuda={AJUDA.mensagens} onChange={(v) => setM({ ...m, mensagens: v })} />
              </div></section>
            )}
            {post.pilar === 'P2' && (
              <section className="cartao"><div className="cartao-corpo stack">
                <h2>Venda</h2>
                <div className="duas">
                  <CampoNumero id="m-leads" nome={NOMES_METRICA.leads} valor={m.leads} ajuda={AJUDA.leads} onChange={(v) => setM({ ...m, leads: v })} />
                  <CampoNumero id="m-vendas" nome={NOMES_METRICA.vendas} valor={m.vendas} ajuda={AJUDA.vendas} onChange={(v) => setM({ ...m, vendas: v })} />
                </div>
              </div></section>
            )}
            {erro && <div className="erro" role="alert">{erro}</div>}
            <div className="barra-acoes">
              <button className="btn" onClick={onVoltar} disabled={salvando}>Cancelar</button>
              <button className="btn primario" onClick={salvar} disabled={salvando}>{salvando ? <><span className="girando" /> Analisando o resultado...</> : 'Salvar e ver diagnóstico'}</button>
            </div>
          </main>
        </>
      );
    }

    const SEVERIDADE = { alta: 'Atenção', media: 'Observação', ok: 'Funcionou' };
    const fmtPct = (x) => (typeof x === 'number' ? `${(x * 100).toFixed(1).replace('.', ',')}%` : '–');

    function VerPost({ uid, postId, onVoltar, onAbrirRoteiro }) {
      const post = useDoc(`clientes/${uid}/posts/${postId}`);
      const [editar, setEditar] = useState(false);
      if (post === undefined) return <Carregando />;
      if (post === null) return <div className="tela-centro"><button className="btn" onClick={onVoltar}>Voltar</button></div>;
      const p = { id: postId, ...post };
      if (!p.metricas || editar) return <FormMetricas uid={uid} post={p} onVoltar={() => (editar ? setEditar(false) : onVoltar())} onSalvo={() => { setEditar(false); window.scrollTo(0, 0); }} />;
      const d = p.diagnostico || {};
      const t = p.taxas || {};
      const linhas = [
        ['Alcance', t.alcance?.toLocaleString('pt-BR')], ['Retenção nos 3s', fmtPct(t.retencao3s)], ['Tempo médio ÷ duração', fmtPct(t.tempoMedioSobreDuracao)],
        ['Compartilhamento', fmtPct(t.taxaCompart)], ['Salvamento', fmtPct(t.taxaSalv)], ['Comentário', fmtPct(t.taxaComent)],
        ['Conversão', fmtPct(t.conversao)], ['Retenção da sequência', fmtPct(t.retencaoSequencia)], ['Respostas', fmtPct(t.taxaResposta)],
      ].filter(([, v]) => v && v !== '–');
      return (
        <>
          <Cabecalho><button className="btn fantasma mini" onClick={onVoltar}>Voltar</button></Cabecalho>
          <main className="wrap conteudo estreito stack-lg">
            <div className="stack">
              <span className="sobretitulo">Diagnóstico · {FORMATOS[p.formato]} · {p.pilar} · {dataHora(p.postadoEm)}</span>
              <h1>{p.tema}</h1>
              <span className="comparado">{d.comparadoCom}</span>
            </div>
            {d.funcionou && <div className="destaque-vencedor"><strong>Funcionou.</strong> O {PILARES[p.pilar].kpi.toLowerCase()} ficou acima da referência. A plataforma guardou o padrão deste post para os próximos.</div>}
            {d.explicacao && <section className="ideia"><span className="sobretitulo">O que aconteceu</span><p className="explicacao"><TextoMarcado texto={d.explicacao} campo="explicacao" pendentes={d.pendentes} /></p></section>}
            {d.ajustesProximo?.length > 0 && (
              <section className="cartao"><div className="faixa" /><div className="cartao-corpo stack">
                <h2>3 ajustes para o próximo post</h2>
                <ol className="passos">{d.ajustesProximo.map((a, i) => <li key={i}><TextoMarcado texto={a} campo={`ajustesProximo.${i}`} pendentes={d.pendentes} /></li>)}</ol>
              </div></section>
            )}
            {d.ganchoVencedor && (
              <div className="destaque-vencedor"><span className="sobretitulo">Gancho vencedor do teste</span><p style={{ marginTop: 6 }}><strong>Gancho {d.ganchoVencedor.n}:</strong> {d.ganchoVencedor.texto}</p></div>
            )}
            {d.achados?.length > 0 && (
              <section className="stack">
                <h3>O que os números mostram</h3>
                {d.achados.map((a, i) => <div key={i} className={'achado ' + a.severidade}><strong>{SEVERIDADE[a.severidade]}</strong> {a.mensagem}</div>)}
              </section>
            )}
            {linhas.length > 0 && (
              <section className="cartao"><div className="cartao-corpo">
                <h3>Números</h3>
                <dl className="dados">{linhas.map(([k, v]) => <React.Fragment key={k}><dt>{k}</dt><dd className="num">{v}</dd></React.Fragment>)}</dl>
              </div></section>
            )}
            <div className="barra-acoes">
              {p.linkPost && <a className="btn" href={p.linkPost} target="_blank" rel="noopener">Abrir no Instagram</a>}
              <button className="btn" onClick={() => onAbrirRoteiro(p.roteiroId)}>Ver roteiro</button>
              <button className="btn" onClick={() => setEditar(true)}>Corrigir números</button>
            </div>
          </main>
        </>
      );
    }

    // Painel inicial: posts esperando resultado, últimos diagnósticos, melhor post do mês por pilar.
    function PainelResultados({ uid, onAbrirPost }) {
      const [posts, setPosts] = useState(null);
      useEffect(() => db.collection(`clientes/${uid}/posts`).orderBy('postadoEm', 'desc').limit(60).onSnapshot(
        (s) => setPosts(s.docs.map((d) => ({ id: d.id, ...d.data() }))), () => setPosts([])
      ), [uid]);
      if (!posts?.length) return null;
      const esperando = posts.filter((p) => !p.metricas);
      const diagnosticos = posts.filter((p) => p.diagnostico).sort((a, b) => (b.metricasPreenchidasEm?.toMillis?.() || 0) - (a.metricasPreenchidasEm?.toMillis?.() || 0)).slice(0, 3);
      const mes = mesReferencia();
      const melhores = ['P1', 'P2', 'P3'].map((pl) => posts.filter((p) => p.mes === mes && p.pilar === pl && typeof p.kpiValor === 'number' && p.kpiValor > 0).sort((a, b) => b.kpiValor - a.kpiValor)[0]).filter(Boolean);
      return (
        <>
          {esperando.length > 0 && (
            <section className="cartao esperando"><div className="cartao-corpo stack">
              <span className="sobretitulo">Posts esperando resultado</span>
              {esperando.map((p) => (
                <button type="button" key={p.id} className="linha-post" onClick={() => onAbrirPost(p.id)}>
                  <span><strong>{p.tema}</strong><span className="suave peq">{FORMATOS[p.formato]} · postado {dataHora(p.postadoEm)}</span></span>
                  <span className="btn mini primario">Preencher</span>
                </button>
              ))}
            </div></section>
          )}
          {melhores.length > 0 && (
            <section className="stack">
              <h2>Melhor post do mês</h2>
              <div className="lista-roteiros">
                {melhores.map((p) => (
                  <button type="button" key={p.id} className="item-roteiro" onClick={() => onAbrirPost(p.id)}>
                    <span className="sobretitulo">{PILARES[p.pilar].nome} · {PILARES[p.pilar].kpi.split(' (')[0].toLowerCase()} {fmtPct(p.kpiValor)}</span>
                    <strong>{p.tema}</strong>
                  </button>
                ))}
              </div>
            </section>
          )}
          {diagnosticos.length > 0 && (
            <section className="stack">
              <h2>Últimos diagnósticos</h2>
              <div className="lista-roteiros">
                {diagnosticos.map((p) => (
                  <button type="button" key={p.id} className="item-roteiro" onClick={() => onAbrirPost(p.id)}>
                    <span className="sobretitulo">{FORMATOS[p.formato]} · {p.pilar}{p.diagnostico.funcionou ? ' · funcionou' : ''}</span>
                    <strong>{p.tema}</strong>
                    {p.diagnostico.ajustesProximo?.[0] && <span className="suave peq">Próximo: {p.diagnostico.ajustesProximo[0]}</span>}
                  </button>
                ))}
              </div>
            </section>
          )}
        </>
      );
    }

    function InicioCliente({ cliente }) {
      const dna = useDna(cliente.id);
      const [tela, setTela] = useState('inicio');
      const [roteiroId, setRoteiroId] = useState(null);
      const abrir = (id) => { setRoteiroId(id); setTela('roteiro'); window.scrollTo(0, 0); };
      const [postId, setPostId] = useState(null);
      const abrirPost = (id) => { setPostId(id); setTela('post'); window.scrollTo(0, 0); };
      const estrategia = useDoc(`clientes/${cliente.id}/estrategia/atual`);
      const foco = useDoc(`clientes/${cliente.id}/focos/${mesReferencia()}`);
      const contagem = useContagemDoMes(cliente.id);
      const mix = mixDoCliente(foco?.objetivoPerfil, cliente);

      if (dna === undefined) return <Carregando />;
      const falta = faltandoNoDna(dna);
      if (!dna?.onboardingConcluido) return <Onboarding uid={cliente.id} cliente={cliente} dna={dna} />;
      if (tela === 'perfil') return <MeuPerfil uid={cliente.id} dna={dna} onVoltar={() => setTela('inicio')} />;
      if (tela === 'foco') return <FormFoco uid={cliente.id} produtos={limparProdutos(dna?.produtos)} quem="cliente" cliente={cliente} onVoltar={() => setTela('inicio')} />;
      if (tela === 'criar' && !falta.length) return <CriarRoteiro dna={dna} estrategia={estrategia} mix={mix} contagem={contagem} objetivoPerfil={foco?.objetivoPerfil} onPronto={abrir} onVoltar={() => setTela('inicio')} />;
      if (tela === 'biblioteca') return <MeusRoteiros uid={cliente.id} onAbrir={abrir} onVoltar={() => setTela('inicio')} />;
      if (tela === 'roteiro') return <VerRoteiro uid={cliente.id} id={roteiroId} onVoltar={() => setTela('inicio')} onAbrir={abrir} onAbrirPost={abrirPost} />;
      if (tela === 'post') return <VerPost uid={cliente.id} postId={postId} onVoltar={() => setTela('inicio')} onAbrirRoteiro={abrir} />;

      return (
        <>
          <Cabecalho>
            <button className="btn fantasma mini" onClick={() => setTela('perfil')}>Meu perfil</button>
            <button className="btn fantasma mini" onClick={() => auth.signOut()}>Sair</button>
          </Cabecalho>
          <main className="wrap conteudo stack-lg">
            <div className="cartao">
              <div className="boas-vindas stack">
                <span className="sobretitulo">Sua área</span>
                <h1>Olá, <em>{primeiroNome(cliente.nome)}</em>.</h1>
                {falta.length ? (
                  <div className="aviso entre">
                    <span>Para gerar roteiros, complete seu perfil. Falta: {falta.join(', ')}.</span>
                    <button className="btn mini" onClick={() => setTela('perfil')}>Completar</button>
                  </div>
                ) : (
                  <p className="suave" style={{ maxWidth: 560 }}>
                    Escolha o formato, o objetivo e o tema: o roteiro sai com a sua voz e com 5 ganchos para testar.
                  </p>
                )}
                <div className="linha">
                  <button className="btn primario" disabled={falta.length > 0} onClick={() => setTela('criar')} title={falta.length ? 'Complete seu perfil primeiro' : ''}>Criar roteiro</button>
                  <button className="btn" onClick={() => setTela('perfil')}>Ver meu perfil</button>
                </div>
              </div>
            </div>
            <PainelResultados uid={cliente.id} onAbrirPost={abrirPost} />
            <CartaoFoco foco={foco} mix={mix} contagem={contagem} onEditar={() => setTela('foco')} />
            <RoteirosRecentes uid={cliente.id} onAbrir={abrir} onVerTodos={() => setTela('biblioteca')} />
            <LembreteMarca estrategia={estrategia} />
            <GuiaDeTeste crescimento={cliente.crescimento} />
          </main>
        </>
      );
    }

    // ==========================================================
    // App: decide a tela e vigia o status do cliente em tempo real
    // ==========================================================
    function App() {
      const [estado, setEstado] = useState({ fase: 'carregando' });
      const [suspenso, setSuspenso] = useState(false);

      useEffect(() => {
        let pararCliente = null;
        const pararAuth = auth.onAuthStateChanged(async (u) => {
          if (pararCliente) { pararCliente(); pararCliente = null; }
          if (!u) return setEstado({ fase: 'login' });

          setEstado({ fase: 'carregando' });
          let token;
          try {
            token = await u.getIdTokenResult();
          } catch (e) {
            // Token revogado ou usuário desativado.
            if (ehSuspensao(e) || e?.code === 'auth/user-token-expired') setSuspenso(true);
            await auth.signOut();
            return;
          }
          if (token.claims.admin === true) return setEstado({ fase: 'admin', usuario: u });
          // Admin marcado pelo Console (documento admins/{uid}).
          try {
            const adm = await db.doc(`admins/${u.uid}`).get();
            if (adm.exists) return setEstado({ fase: 'admin', usuario: u });
          } catch {
            // Sem permissão ou sem rede: segue como cliente.
          }

          // Cliente: escuta o próprio documento. Se o status mudar ou a leitura for negada, sai.
          pararCliente = db.doc(`clientes/${u.uid}`).onSnapshot(
            (snap) => {
              const c = snap.data();
              if (!snap.exists || c.status !== 'ativo') {
                setSuspenso(true);
                auth.signOut();
                return;
              }
              setEstado({ fase: 'cliente', usuario: u, cliente: { id: snap.id, ...c } });
            },
            (e) => {
              if (ehSuspensao(e)) setSuspenso(true);
              else toast(mensagemErro(e));
              auth.signOut();
            }
          );
        });
        return () => { pararAuth(); if (pararCliente) pararCliente(); };
      }, []);

      let tela;
      if (suspenso && estado.fase !== 'admin' && estado.fase !== 'cliente') {
        tela = <AcessoSuspenso onVoltar={() => setSuspenso(false)} />;
      } else if (estado.fase === 'carregando') {
        tela = <Carregando />;
      } else if (estado.fase === 'login') {
        tela = <Login onSuspenso={() => setSuspenso(true)} />;
      } else if (estado.fase === 'admin') {
        tela = <PainelAdmin />;
      } else {
        tela = <InicioCliente cliente={estado.cliente} />;
      }
      return <>{tela}<Toast /></>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
