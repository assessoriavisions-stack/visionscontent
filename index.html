<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F3EC" />
  <meta name="color-scheme" content="light" />
  <title>Roteiros · Visions Marketing</title>
  <link rel="icon" type="image/png" href="assets/logo-visions.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-functions-compat.js"></script>

  <style>
    :root {
      /* Base */
      --marfim: #F6F3EC;
      --superficie: #FFFFFF;
      --superficie-2: #FBF9F5;
      --tinta: #0F1A33;
      --tinta-2: #3B4459;
      --suave: #7A7F8E;
      --linha: #E8E3D8;
      --linha-2: #F0ECE3;

      /* Cores da marca (logo) */
      --vermelho: #DD2A2A;
      --amarelo: #FFCF51;
      --azul: #2657A5;
      --vermelho-claro: #FCECEA;
      --amarelo-claro: #FFF5DA;
      --azul-claro: #EBF0F9;
      --verde: #2E7D5B;
      --verde-claro: #E6F2EB;

      --serifa: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      --raio: 18px;
      --raio-sm: 12px;
      --sombra: 0 1px 0 rgba(15, 26, 51, .03), 0 18px 40px -22px rgba(15, 26, 51, .22);
      --sombra-leve: 0 1px 2px rgba(15, 26, 51, .05);
      --faixa: linear-gradient(90deg, var(--vermelho) 0 45%, var(--amarelo) 45% 70%, var(--azul) 70% 100%);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--marfim);
      color: var(--tinta);
      font: 15px/1.55 var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    ::selection { background: var(--amarelo); color: var(--tinta); }

    h1, h2, h3 { margin: 0; font-family: var(--serifa); font-weight: 500; letter-spacing: -.015em; line-height: 1.15; font-variation-settings: "opsz" 72; }
    h1 { font-size: clamp(28px, 6vw, 36px); }
    h2 { font-size: 22px; }
    h3 { font-size: 19px; }
    p { margin: 0; }
    .suave { color: var(--suave); }
    .peq { font-size: 13px; }
    .sobretitulo { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); }
    .num { font-variant-numeric: tabular-nums; }

    .faixa { height: 3px; background: var(--faixa); }
    .faixa.fina { height: 2px; }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
    .stack > * + * { margin-top: 16px; }
    .stack-lg > * + * { margin-top: 28px; }
    .linha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .entre { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

    .cartao {
      background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio);
      box-shadow: var(--sombra); overflow: hidden;
    }
    .cartao-corpo { padding: 22px; }
    @media (min-width: 560px) { .cartao-corpo { padding: 28px; } }

    /* Campos */
    label { display: block; font-size: 13px; font-weight: 500; color: var(--tinta-2); margin-bottom: 7px; }
    .dica { font-size: 12.5px; color: var(--suave); margin-top: 6px; }
    input, select, textarea {
      width: 100%; padding: 12px 14px; min-height: 48px; border-radius: var(--raio-sm);
      border: 1px solid var(--linha); background: var(--superficie); outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: #A8ABB6; }
    input:hover, select:hover { border-color: #D8D2C4; }
    input:focus, select:focus, textarea:focus { border-color: var(--azul); box-shadow: 0 0 0 4px var(--azul-claro); }
    input:disabled { background: var(--superficie-2); color: var(--suave); }

    /* Botões */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 18px; min-height: 46px; border-radius: var(--raio-sm);
      border: 1px solid var(--linha); background: var(--superficie); cursor: pointer;
      font-weight: 500; font-size: 14.5px; white-space: nowrap; letter-spacing: .005em;
      transition: transform .12s, box-shadow .15s, background .15s, border-color .15s;
    }
    .btn:hover:not(:disabled) { border-color: #D3CCBC; box-shadow: var(--sombra-leve); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--azul-claro); }
    .btn.primario { background: var(--tinta); border-color: var(--tinta); color: var(--marfim); }
    .btn.primario:hover:not(:disabled) { background: #1B2846; box-shadow: 0 8px 20px -10px rgba(15, 26, 51, .55); }
    .btn.perigo { color: var(--vermelho); }
    .btn.perigo:hover:not(:disabled) { background: var(--vermelho-claro); border-color: #F4CFCB; }
    .btn.positivo { color: var(--verde); }
    .btn.positivo:hover:not(:disabled) { background: var(--verde-claro); border-color: #C9E2D3; }
    .btn.fantasma { background: transparent; border-color: transparent; }
    .btn.fantasma:hover:not(:disabled) { background: rgba(15, 26, 51, .05); box-shadow: none; }
    .btn.texto { background: none; border: none; padding: 4px 0; min-height: 0; color: var(--azul); font-weight: 500; }
    .btn.texto:hover { text-decoration: underline; box-shadow: none; }
    .btn.cheio { width: 100%; }
    .btn.mini { padding: 7px 13px; min-height: 36px; font-size: 13.5px; }

    .erro { background: var(--vermelho-claro); color: #A61F1F; padding: 11px 14px; border-radius: var(--raio-sm); font-size: 14px; }
    .aviso { background: var(--amarelo-claro); color: #6B4E00; padding: 14px 16px; border-radius: var(--raio-sm); font-size: 14px; border: 1px solid #F6E3A8; }

    /* Login */
    .login { min-height: 100vh; display: grid; grid-template-columns: 1fr; align-content: start; }
    .login-marca { padding: 48px 24px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 22px; }
    .login-marca img { width: min(260px, 72vw); height: auto; }
    .login-marca .chamada { display: none; }
    .login-form { padding: 16px 16px 40px; display: flex; justify-content: center; align-items: flex-start; }
    .login-form .cartao { width: 100%; max-width: 420px; }
    @media (min-width: 900px) {
      .login { grid-template-columns: 1.1fr 1fr; align-content: stretch; }
      .login-marca { align-items: flex-start; text-align: left; justify-content: center; padding: 64px 72px; border-right: 1px solid var(--linha); background:
        radial-gradient(1200px 500px at -10% 110%, rgba(38, 87, 165, .07), transparent 60%),
        radial-gradient(800px 400px at 110% -10%, rgba(255, 207, 81, .12), transparent 60%); }
      .login-marca img { width: 320px; }
      .login-marca .chamada { display: block; max-width: 440px; }
      .login-form { align-items: center; padding: 48px; }
    }
    .chamada h1 { font-size: 44px; line-height: 1.08; }
    .chamada h1 em { font-style: italic; color: var(--azul); }

    /* Cabeçalho */
    .cabecalho { position: sticky; top: 0; z-index: 20; background: rgba(246, 243, 236, .86); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); }
    .cabecalho .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 68px; }
    .cabecalho img { height: 38px; width: auto; display: block; }
    .cabecalho .marca { display: flex; align-items: center; gap: 14px; }
    .cabecalho .divisor { width: 1px; height: 22px; background: var(--linha); }
    .conteudo { padding-top: 28px; padding-bottom: calc(48px + env(safe-area-inset-bottom)); }

    /* Indicadores */
    .indicadores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .indicador { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-sm); padding: 14px 14px 12px; position: relative; overflow: hidden; }
    .indicador::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
    .indicador.v::before { background: var(--azul); }
    .indicador.r::before { background: var(--vermelho); }
    .indicador.a::before { background: var(--amarelo); }
    .indicador .valor { font-family: var(--serifa); font-size: 30px; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
    @media (min-width: 720px) { .indicador { padding: 18px 20px 16px; } .indicador .valor { font-size: 36px; } }

    .filtros { display: grid; gap: 10px; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .filtros { grid-template-columns: 1fr 220px; } }

    /* Clientes */
    .grade { display: grid; gap: 14px; grid-template-columns: 1fr; }
    @media (min-width: 760px) { .grade { grid-template-columns: 1fr 1fr; } }
    .cliente { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .cliente-topo { display: flex; gap: 14px; align-items: center; }
    .avatar { width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--serifa); font-size: 17px; font-weight: 500; }
    .avatar.c0 { background: var(--azul-claro); color: var(--azul); }
    .avatar.c1 { background: var(--vermelho-claro); color: var(--vermelho); }
    .avatar.c2 { background: var(--amarelo-claro); color: #8A6400; }
    .cliente-nome { min-width: 0; flex: 1; }
    .cliente-nome h3 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .selo { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
    .selo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .selo.ativo { background: var(--verde-claro); color: var(--verde); }
    .selo.bloqueado { background: var(--vermelho-claro); color: var(--vermelho); }
    .selo.alerta { background: var(--amarelo-claro); color: #8A6400; }
    .dados { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13.5px; margin: 0; padding: 14px 0; border-top: 1px solid var(--linha-2); border-bottom: 1px solid var(--linha-2); }
    .dados dt { color: var(--suave); }
    .dados dd { margin: 0; text-align: right; overflow-wrap: anywhere; color: var(--tinta-2); }
    .uso { display: flex; flex-direction: column; gap: 7px; }
    .barra { height: 4px; background: var(--linha-2); border-radius: 99px; overflow: hidden; }
    .barra > i { display: block; height: 100%; background: var(--azul); border-radius: 99px; transition: width .4s; }
    .barra.cheia > i { background: var(--vermelho); }
    .acoes { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Modal (vira folha de baixo no celular) */
    .fundo-modal { position: fixed; inset: 0; background: rgba(15, 26, 51, .38); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; z-index: 50; animation: surge .18s ease-out; }
    @media (min-width: 560px) { .fundo-modal { align-items: center; padding: 16px; } }
    .modal { background: var(--superficie); width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; border-radius: 22px 22px 0 0; box-shadow: 0 30px 80px -20px rgba(15, 26, 51, .45); animation: sobe .22s cubic-bezier(.2, .8, .2, 1); }
    .modal .modal-corpo { padding: 22px 18px calc(24px + env(safe-area-inset-bottom)); }
    @media (min-width: 560px) { .modal { border-radius: 22px; } .modal .modal-corpo { padding: 28px; } }
    @keyframes surge { from { opacity: 0; } }
    @keyframes sobe { from { transform: translateY(24px); opacity: 0; } }
    .duas { display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 520px) { .duas { grid-template-columns: 1fr 1fr; } }

    .credencial { background: var(--superficie-2); border: 1px solid var(--linha); border-radius: var(--raio-sm); padding: 14px 16px; }
    .credencial .valor { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 17px; margin-top: 4px; overflow-wrap: anywhere; }
    .credencial.destaque { background: var(--amarelo-claro); border-color: #F6E3A8; }
    .credencial.destaque .valor { font-size: 22px; letter-spacing: .04em; }

    .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--tinta); color: var(--marfim); padding: 13px 20px; border-radius: 14px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 16px 40px -12px rgba(15, 26, 51, .5); animation: sobe .2s ease-out; }
    .girando { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: gira .7s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    .tela-centro { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .vazio { text-align: center; padding: 48px 20px; }
    .vazio h3 { margin-bottom: 6px; }

    /* Boas-vindas do cliente */
    .boas-vindas { padding: 28px 22px; }
    @media (min-width: 560px) { .boas-vindas { padding: 40px; } }
    .boas-vindas h1 em { font-style: italic; color: var(--azul); }

    /* DNA do perfil */
    .estreito { max-width: 720px; }
    textarea { min-height: 0; resize: vertical; line-height: 1.5; }
    .progresso { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .progresso button { height: 5px; border: 0; padding: 0; border-radius: 99px; background: var(--linha); cursor: pointer; }
    .progresso button:disabled { cursor: default; }
    .progresso button.feito { background: var(--tinta); }
    .progresso button.atual { background: var(--azul); }
    .eixo strong { font-weight: 500; font-size: 14px; color: var(--tinta-2); }
    .escala { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
    .escala button { min-height: 46px; border-radius: var(--raio-sm); border: 1px solid var(--linha); background: var(--superficie); cursor: pointer; font-family: var(--serifa); font-size: 17px; color: var(--tinta-2); transition: all .15s; }
    .escala button:hover { border-color: #D3CCBC; }
    .escala button.ativo { background: var(--tinta); border-color: var(--tinta); color: var(--marfim); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--azul-claro); color: var(--azul); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 13.5px; }
    .chip button { border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 16px; line-height: 1; width: 22px; height: 22px; border-radius: 50%; }
    .chip button:hover { background: rgba(38, 87, 165, .12); }
    .linha-input { display: flex; gap: 8px; }
    .linha-input input { flex: 1; min-width: 0; }
    .linha-input .btn { min-height: 48px; }
    .carregando-ia { display: flex; align-items: center; gap: 10px; padding: 18px; border-radius: var(--raio-sm); background: var(--azul-claro); color: var(--azul); font-weight: 500; }
    .barra-acoes { display: flex; justify-content: flex-end; gap: 10px; position: sticky; bottom: 0; padding: 14px 0 calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--marfim) 70%, transparent); }

    /* Fase de crescimento */
    .selo.testes { background: var(--azul-claro); color: var(--azul); }
    .selo.vencedor { background: var(--amarelo-claro); color: #8A6400; }
    .secao-form { border-top: 1px solid var(--linha-2); padding-top: 18px; }
    .guia { padding: 24px 22px; }
    @media (min-width: 560px) { .guia { padding: 32px 40px; } }
    .passos { list-style: none; margin: 0; padding: 0; counter-reset: passo; }
    .passos li { counter-increment: passo; position: relative; padding: 14px 0 14px 46px; border-top: 1px solid var(--linha-2); }
    .passos li:first-child { border-top: 0; }
    .passos li::before { content: counter(passo); position: absolute; left: 0; top: 13px; width: 30px; height: 30px; border-radius: 50%; background: var(--tinta); color: var(--marfim); display: grid; place-items: center; font-family: var(--serifa); font-size: 15px; }
    .passos strong, .regras strong { color: var(--tinta); font-weight: 600; }
    .regras { display: grid; gap: 10px; grid-template-columns: 1fr; margin: 0; padding: 0; list-style: none; }
    @media (min-width: 720px) { .regras { grid-template-columns: 1fr 1fr; } }
    .regras li { background: var(--superficie-2); border: 1px solid var(--linha); border-radius: var(--raio-sm); padding: 14px 16px; font-size: 14px; color: var(--tinta-2); }
    .destaque-vencedor { background: var(--amarelo-claro); border: 1px solid #F6E3A8; border-radius: var(--raio-sm); padding: 16px 18px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useCallback } = React;

    // ==========================================================
    // Configuração do Firebase
    // Console > Configurações do projeto > Seus apps > Configuração do SDK
    // (esses valores são públicos por natureza; a segurança vem das regras e das functions)
    // ==========================================================
    const FIREBASE_CONFIG = {
      apiKey: 'PREENCHER',
      authDomain: 'visionscontent-cba52.firebaseapp.com',
      projectId: 'visionscontent-cba52',
      storageBucket: 'visionscontent-cba52.firebasestorage.app',
      messagingSenderId: 'PREENCHER',
      appId: 'PREENCHER',
    };
    const REGIAO_FUNCTIONS = 'southamerica-east1';
    const FUSO = 'America/Sao_Paulo';
    const MSG_SUSPENSO = 'Seu acesso está suspenso. Fale com a Visions.';
    const LOGO = 'assets/logo-visions.png';

    // Catálogos (mesmos ids de functions/ia/catalogos.js)
    const FORMATOS = { carrossel: 'Carrossel', post_unico: 'Post único', story_unico: 'Story único', sequencia_stories: 'Sequência de stories', reels: 'Reels', serie: 'Série' };
    const FORMATOS_VISUAIS = { talking_head: 'Talking head', vlog: 'Vlog / daily', tela_dividida: 'Tela dividida', storytelling_broll: 'Storytelling com b-roll', pov: 'POV', react: 'React / comentário de caso', tutorial_tela: 'Tutorial em tela' };
    const ANGULOS = { erro_comum: 'Erro comum', maior_desejo: 'Maior desejo', mito_industria: 'Mito da indústria', historia_pessoal: 'História pessoal', duvida_comum: 'Dúvida comum', passo_a_passo: 'Passo a passo' };
    const TIPOS_GANCHO = { situacao_especifica: 'Situação específica', dado_contraintuitivo: 'Dado que contraria o senso comum', afirmacao_forte: 'Afirmação forte', metafora: 'Metáfora que pede explicação', erro_comum: 'Erro comum de quem assiste' };

    function resumoVencedor(v) {
      if (!v) return '';
      return [FORMATOS[v.formato], FORMATOS_VISUAIS[v.formatoVisual], ANGULOS[v.angulo], v.tipoGancho && 'gancho: ' + TIPOS_GANCHO[v.tipoGancho].toLowerCase()]
        .filter(Boolean).join(' · ');
    }

    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const fns = firebase.app().functions(REGIAO_FUNCTIONS);

    // Rodando local (localhost/127.0.0.1): usa os emuladores do Firebase.
    const EMULADOR = ['localhost', '127.0.0.1'].includes(location.hostname);
    if (EMULADOR) {
      auth.useEmulator('http://127.0.0.1:9099', { disableWarnings: true });
      db.useEmulator('127.0.0.1', 8080);
      fns.useEmulator('127.0.0.1', 5001);
    }

    // ==========================================================
    // Utilitários
    // ==========================================================
    async function chamar(nome, dados = {}) {
      const r = await fns.httpsCallable(nome)(dados);
      return r.data;
    }

    function mensagemErro(e) {
      const codigo = String(e?.code || '').replace(/^functions\//, '');
      const porCodigo = {
        'auth/invalid-credential': 'E-mail ou senha incorretos. Confira e tente de novo.',
        'auth/invalid-login-credentials': 'E-mail ou senha incorretos. Confira e tente de novo.',
        'auth/wrong-password': 'E-mail ou senha incorretos. Confira e tente de novo.',
        'auth/user-not-found': 'E-mail ou senha incorretos. Confira e tente de novo.',
        'auth/invalid-email': 'Esse e-mail não parece válido.',
        'auth/user-disabled': MSG_SUSPENSO,
        'auth/too-many-requests': 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.',
        'auth/network-request-failed': 'Sem conexão com a internet. Confira sua rede e tente de novo.',
        'unavailable': 'Sem conexão com o servidor. Confira sua internet e tente de novo.',
        'deadline-exceeded': 'O servidor demorou para responder. Tente de novo.',
      };
      if (porCodigo[codigo]) return porCodigo[codigo];
      // Erros das functions já vêm em português; o SDK acrescenta " [403]" no fim.
      if (e?.message && !/^Firebase:/.test(e.message)) return e.message.replace(/\s*\[\d{3}\]$/, '');
      return 'Algo deu errado. Tente de novo em alguns minutos.';
    }

    const ehSuspensao = (e) =>
      ['permission-denied', 'functions/permission-denied', 'auth/user-disabled'].includes(e?.code);

    function mesReferencia(d = new Date()) {
      return new Intl.DateTimeFormat('en-CA', { timeZone: FUSO, year: 'numeric', month: '2-digit' }).format(d);
    }
    function nomeDoMes(d = new Date()) {
      return new Intl.DateTimeFormat('pt-BR', { timeZone: FUSO, month: 'long' }).format(d);
    }
    // Timestamp -> "2026-12-31" no fuso de Brasília (para o input de data)
    function paraISO(ts) {
      if (!ts) return '';
      return new Intl.DateTimeFormat('en-CA', { timeZone: FUSO, year: 'numeric', month: '2-digit', day: '2-digit' }).format(ts.toDate());
    }
    function paraBR(ts) {
      if (!ts) return '';
      return new Intl.DateTimeFormat('pt-BR', { timeZone: FUSO, day: '2-digit', month: 'short', year: 'numeric' }).format(ts.toDate()).replace('.', '');
    }
    function diasAte(ts) {
      if (!ts) return null;
      return Math.ceil((ts.toMillis() - Date.now()) / 86400000);
    }
    function geracoesDoMes(c) {
      return c.mesReferencia === mesReferencia() ? (c.geracoesNoMes || 0) : 0;
    }
    function iniciais(nome) {
      const p = (nome || '?').trim().split(/\s+/);
      return ((p[0]?.[0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
    }
    function corDoNome(nome) {
      let h = 0;
      for (const ch of nome || '') h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return 'c' + (h % 3);
    }
    const primeiroNome = (n) => (n || '').trim().split(/\s+/)[0];

    async function copiar(texto) {
      try {
        await navigator.clipboard.writeText(texto);
        return true;
      } catch {
        const t = document.createElement('textarea');
        t.value = texto;
        document.body.appendChild(t);
        t.select();
        const ok = document.execCommand('copy');
        t.remove();
        return ok;
      }
    }

    // Toast simples
    let mostrarToastGlobal = () => {};
    const toast = (msg) => mostrarToastGlobal(msg);
    function Toast() {
      const [msg, setMsg] = useState('');
      useEffect(() => {
        let timer;
        mostrarToastGlobal = (m) => {
          setMsg(m);
          clearTimeout(timer);
          timer = setTimeout(() => setMsg(''), 3400);
        };
      }, []);
      return msg ? <div className="toast" role="status">{msg}</div> : null;
    }

        setErro('');

        setEnviando(true);
        try {
          await auth.signInWithEmailAndPassword(email.trim(), senha);
        } catch (e) {
          setEnviando(false);
          if (e?.code === 'auth/user-disabled') return onSuspenso();
          setErro(mensagemErro(e));

        setErro('');
        if (!email.trim()) return setErro('Digite seu e-mail acima e toque de novo em "Esqueci minha senha".');

          await auth.sendPasswordResetEmail(email.trim());

        window.addEventListener('keydown', esc);

      }, [onFechar]);

        <div className="fundo-modal" onClick={(e) => e.target === e.currentTarget && onFechar()}>

    function FormCliente({ cliente, onFechar, onCriado }) {
      const editando = !!cliente;
      const [f, setF] = useState({
        nome: cliente?.nome || '',
        email: cliente?.email || '',
        perfilInstagram: cliente?.perfilInstagram || '',
        venceEm: paraISO(cliente?.venceEm),
        limiteGeracoesMes: cliente?.limiteGeracoesMes ?? '',
        fase: cliente?.crescimento?.fase || 'testes',
        vFormato: cliente?.crescimento?.vencedor?.formato || '',
        vFormatoVisual: cliente?.crescimento?.vencedor?.formatoVisual || '',
        vAngulo: cliente?.crescimento?.vencedor?.angulo || '',
        vTipoGancho: cliente?.crescimento?.vencedor?.tipoGancho || '',
        vObs: cliente?.crescimento?.vencedor?.observacao || '',
      });
      const [erro, setErro] = useState('');
      const [salvando, setSalvando] = useState(false);
      const mudar = (campo) => (e) => setF({ ...f, [campo]: e.target.value });

      async function salvar(ev) {
        ev.preventDefault();
        setErro('');
        if (!f.nome.trim()) return setErro('Preencha o nome.');
        if (!editando && !f.email.trim()) return setErro('Preencha o e-mail.');
        if (editando && f.fase === 'vencedor_definido' && !f.vFormato) return setErro('Escolha pelo menos o formato vencedor.');
        setSalvando(true);
        const base = {
          nome: f.nome,
          perfilInstagram: f.perfilInstagram,
          venceEm: f.venceEm || null,
          limiteGeracoesMes: f.limiteGeracoesMes === '' ? null : Number(f.limiteGeracoesMes),
        };
        try {
          if (editando) {
            const crescimento = f.fase === 'testes'
              ? { fase: 'testes' }
              : { fase: 'vencedor_definido', vencedor: { formato: f.vFormato, formatoVisual: f.vFormatoVisual || null, angulo: f.vAngulo || null, tipoGancho: f.vTipoGancho || null, observacao: f.vObs } };
            const mudouFase = JSON.stringify(crescimento) !== JSON.stringify(
              cliente.crescimento?.fase === 'vencedor_definido'
                ? { fase: 'vencedor_definido', vencedor: { formato: cliente.crescimento.vencedor?.formato || '', formatoVisual: cliente.crescimento.vencedor?.formatoVisual || null, angulo: cliente.crescimento.vencedor?.angulo || null, tipoGancho: cliente.crescimento.vencedor?.tipoGancho || null, observacao: cliente.crescimento.vencedor?.observacao || '' } }
                : { fase: 'testes' });
            await chamar('adminAtualizarCliente', { uid: cliente.id, ...base, ...(mudouFase ? { crescimento } : {}) });
            toast('Cliente atualizado.');
            onFechar();
          } else {
            const r = await chamar('adminCriarCliente', { ...base, email: f.email });
            onCriado({ nome: f.nome, email: r.email, senha: r.senhaProvisoria });
          }
        } catch (e) {
          setErro(mensagemErro(e));
          setSalvando(false);
        }
      }

      return (
        <Modal titulo={editando ? cliente.nome : 'Novo cliente'} sobretitulo={editando ? 'Editar cliente' : 'Criar acesso'} onFechar={onFechar}>
          <form className="stack" onSubmit={salvar} noValidate>
            <div>
              <label htmlFor="f-nome">Nome</label>
              <input id="f-nome" value={f.nome} onChange={mudar('nome')} autoFocus />
            </div>
            <div>
              <label htmlFor="f-email">E-mail de login</label>
              <input id="f-email" type="email" placeholder="cliente@email.com" value={f.email} onChange={mudar('email')} disabled={editando} />
              {editando && <p className="dica">O e-mail de login não muda por aqui.</p>}
            </div>
            <div>
              <label htmlFor="f-ig">Perfil do Instagram</label>
              <input id="f-ig" placeholder="@perfil" value={f.perfilInstagram} onChange={mudar('perfilInstagram')} />
            </div>
            <div className="duas">
              <div>
                <label htmlFor="f-vence">Vencimento</label>
                <input id="f-vence" type="date" value={f.venceEm} onChange={mudar('venceEm')} />
                <p className="dica">Em branco: sem vencimento. O bloqueio acontece sozinho no dia seguinte.</p>
              </div>
              <div>
                <label htmlFor="f-limite">Gerações por mês</label>
                <input id="f-limite" type="number" min="0" inputMode="numeric" placeholder="Sem limite" value={f.limiteGeracoesMes} onChange={mudar('limiteGeracoesMes')} />
                <p className="dica">Controle de custo. Em branco: sem limite.</p>
              </div>
            </div>
            {editando && (
              <div className="secao-form stack">
                <div>
                  <span className="sobretitulo">Fase de crescimento</span>
                  <p className="dica" style={{ marginTop: 4 }}>
                    No começo o cliente testa formatos. Quando você identificar o que funciona para ele, marque o vencedor:
                    a plataforma passa a priorizar esse caminho.
                  </p>
                </div>
                <div>
                  <label htmlFor="f-fase">Fase</label>
                  <select id="f-fase" value={f.fase} onChange={mudar('fase')}>
                    <option value="testes">Testando formatos</option>
                    <option value="vencedor_definido">Formato vencedor definido</option>
                  </select>
                </div>
                {f.fase === 'vencedor_definido' && (
                  <>
                    <div className="duas">
                      <div>
                        <label htmlFor="f-vformato">Formato</label>
                        <select id="f-vformato" value={f.vFormato} onChange={mudar('vFormato')}>
                          <option value="">Escolha</option>
                          {Object.entries(FORMATOS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                        </select>
                      </div>
                      <div>
                        <label htmlFor="f-vvisual">Formato visual</label>
                        <select id="f-vvisual" value={f.vFormatoVisual} onChange={mudar('vFormatoVisual')}>
                          <option value="">Não definido</option>
                          {Object.entries(FORMATOS_VISUAIS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                        </select>
                      </div>
                      <div>
                        <label htmlFor="f-vangulo">Ângulo</label>
                        <select id="f-vangulo" value={f.vAngulo} onChange={mudar('vAngulo')}>
                          <option value="">Não definido</option>
                          {Object.entries(ANGULOS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                        </select>
                      </div>
                      <div>
                        <label htmlFor="f-vgancho">Tipo de gancho</label>
                        <select id="f-vgancho" value={f.vTipoGancho} onChange={mudar('vTipoGancho')}>
                          <option value="">Não definido</option>
                          {Object.entries(TIPOS_GANCHO).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                        </select>
                      </div>
                    </div>
                    <div>
                      <label htmlFor="f-vobs">Observação para o cliente</label>
                      <input id="f-vobs" placeholder="Ex.: vídeos curtos com bastidor da cozinha funcionam melhor" value={f.vObs} onChange={mudar('vObs')} />
                    </div>
                  </>
                )}
              </div>
            )}
            {erro && <div className="erro" role="alert">{erro}</div>}
            <button className="btn primario cheio" disabled={salvando}>
              {salvando ? <><span className="girando" /> Salvando...</> : editando ? 'Salvar alterações' : 'Criar cliente'}
            </button>
          </form>
        </Modal>
      );
    }

    function CartaoCliente({ c, onEditar, onSenha }) {
      const [ocupado, setOcupado] = useState(false);
      const ativo = c.status === 'ativo';
      const usadas = geracoesDoMes(c);
      const dias = diasAte(c.venceEm);
      const pct = c.limiteGeracoesMes ? Math.min(100, Math.round((usadas / c.limiteGeracoesMes) * 100)) : 0;

      async function alternarBloqueio() {
        const pergunta = ativo
          ? `Bloquear ${c.nome}? O acesso cai na hora, mesmo com o app aberto. Nada é apagado.`
          : `Desbloquear ${c.nome}? O acesso volta com tudo como estava.`;
        if (!confirm(pergunta)) return;
        setOcupado(true);
        try {
          await chamar(ativo ? 'adminBloquearCliente' : 'adminDesbloquearCliente', { uid: c.id });
          toast(ativo ? `Acesso de ${primeiroNome(c.nome)} bloqueado.` : `Acesso de ${primeiroNome(c.nome)} liberado.`);
        } catch (e) {
          toast(mensagemErro(e));
        }
        setOcupado(false);
      }

      async function novaSenha() {
        if (!confirm(`Gerar uma nova senha para ${c.nome}? A senha atual deixa de funcionar e as sessões abertas são encerradas.`)) return;
        setOcupado(true);
        try {
          const r = await chamar('adminRedefinirSenha', { uid: c.id });
          onSenha({ nome: c.nome, email: c.email, senha: r.senhaProvisoria, titulo: 'Nova senha gerada' });
        } catch (e) {
          toast(mensagemErro(e));
        }
        setOcupado(false);
      }

      return (
        <article className="cartao cliente">
          <div className="cliente-topo">
            <div className={'avatar ' + corDoNome(c.nome)} aria-hidden="true">{iniciais(c.nome)}</div>
            <div className="cliente-nome">
              <h3>{c.nome}</h3>
              <div className="suave peq">{c.perfilInstagram ? '@' + c.perfilInstagram : 'perfil não informado'}</div>
            </div>
            <span className={'selo ' + (ativo ? 'ativo' : 'bloqueado')}>{ativo ? 'Ativo' : 'Bloqueado'}</span>
          </div>

          <dl className="dados">
            <dt>Fase</dt>
            <dd>
              {c.crescimento?.fase === 'vencedor_definido'
                ? <><span className="selo vencedor">Vencedor definido</span><div className="suave peq" style={{ marginTop: 4 }}>{resumoVencedor(c.crescimento.vencedor)}</div></>
                : <span className="selo testes">Testando formatos</span>}
            </dd>
            <dt>E-mail</dt><dd>{c.email}</dd>
            <dt>Vencimento</dt>
            <dd>
              {ativo && dias !== null && dias >= 0 && dias <= 7 && <><span className="selo alerta">{dias === 0 ? 'vence hoje' : `em ${dias} dia${dias > 1 ? 's' : ''}`}</span>{' '}</>}
              {c.venceEm ? paraBR(c.venceEm) : 'sem vencimento'}
            </dd>
            {!ativo && c.bloqueadoEm && <><dt>Bloqueado em</dt><dd>{paraBR(c.bloqueadoEm)}{c.origemBloqueio === 'vencimento' ? ' · vencimento' : ''}</dd></>}
          </dl>

          <div className="uso">
            <div className="entre peq">
              <span className="suave">Gerações em {nomeDoMes()}</span>
              <span className="num">{usadas}{c.limiteGeracoesMes != null ? <span className="suave"> / {c.limiteGeracoesMes}</span> : <span className="suave"> · sem limite</span>}</span>
            </div>
            {c.limiteGeracoesMes ? <div className={'barra' + (pct >= 100 ? ' cheia' : '')} aria-hidden="true"><i style={{ width: pct + '%' }} /></div> : null}
          </div>

          <div className="acoes">
            <button className="btn mini" onClick={() => onEditar(c)} disabled={ocupado}>Editar</button>
            <button className="btn mini" onClick={novaSenha} disabled={ocupado}>Nova senha</button>
            <span style={{ flex: 1 }} />
            <button className={'btn mini ' + (ativo ? 'perigo' : 'positivo')} onClick={alternarBloqueio} disabled={ocupado}>
              {ativo ? 'Bloquear' : 'Desbloquear'}
            </button>
          </div>
        </article>
      );
    }

    function PainelAdmin() {
      const [clientes, setClientes] = useState(null);
      const [erro, setErro] = useState('');
      const [busca, setBusca] = useState('');
      const [filtro, setFiltro] = useState('todos');
      const [modal, setModal] = useState(null); // {tipo: 'novo'|'editar'|'senha', dados}
      const [configFalta, setConfigFalta] = useState(false);

      useEffect(() => {
        const parar = db.collection('clientes').onSnapshot(
          (s) => setClientes(s.docs.map((d) => ({ id: d.id, ...d.data() }))),
          (e) => setErro(mensagemErro(e))
        );
        db.doc('config/travaAntiIA').get().then((d) => setConfigFalta(!d.exists)).catch(() => {});
        return parar;
      }, []);

      const lista = useMemo(() => {
        if (!clientes) return [];
        const q = busca.trim().toLowerCase().replace(/^@/, '');
        return clientes
          .filter((c) => filtro === 'todos' || c.status === filtro)
          .filter((c) => !q || [c.nome, c.email, c.perfilInstagram].some((v) => (v || '').toLowerCase().includes(q)))
          .sort((a, b) => (a.status === b.status ? a.nome.localeCompare(b.nome, 'pt-BR') : a.status === 'ativo' ? -1 : 1));
      }, [clientes, busca, filtro]);

      const totais = useMemo(() => {
        const t = { ativo: 0, bloqueado: 0, geracoes: 0 };
        (clientes || []).forEach((c) => {
          t[c.status] = (t[c.status] || 0) + 1;
          t.geracoes += geracoesDoMes(c);
        });
        return t;
      }, [clientes]);

      async function criarConfig() {
        try {
          const r = await chamar('adminInicializarConfig');
          setConfigFalta(false);
          toast(r.criados.length ? 'Configurações iniciais criadas.' : 'As configurações já existiam.');
        } catch (e) {
          toast(mensagemErro(e));
        }
      }

      const fechar = useCallback(() => setModal(null), []);

      return (
        <>
          <Cabecalho rotulo="Admin">
            <button className="btn fantasma mini" onClick={() => auth.signOut()}>Sair</button>
          </Cabecalho>

          <main className="wrap conteudo stack-lg">
            <div className="entre" style={{ alignItems: 'flex-end' }}>
              <div>
                <span className="sobretitulo">Painel</span>
                <h1 style={{ marginTop: 6 }}>Clientes</h1>
              </div>
              <button className="btn primario" onClick={() => setModal({ tipo: 'novo' })}>Novo cliente</button>
            </div>

            <div className="indicadores">
              <div className="indicador v"><span className="sobretitulo">Ativos</span><div className="valor">{clientes ? totais.ativo : '–'}</div></div>
              <div className="indicador r"><span className="sobretitulo">Bloqueados</span><div className="valor">{clientes ? totais.bloqueado : '–'}</div></div>
              <div className="indicador a"><span className="sobretitulo">Gerações</span><div className="valor">{clientes ? totais.geracoes : '–'}</div></div>
            </div>

            {configFalta && (
              <div className="aviso entre">
                <span>Faltam as configurações iniciais: lista da trava anti-IA e referências de métricas.</span>
                <button className="btn mini" onClick={criarConfig}>Criar agora</button>
              </div>
            )}

            <div className="stack">
              <div className="filtros">
                <input placeholder="Buscar por nome, e-mail ou @" value={busca} onChange={(e) => setBusca(e.target.value)} aria-label="Buscar cliente" />
                <select value={filtro} onChange={(e) => setFiltro(e.target.value)} aria-label="Filtrar por status">
                  <option value="todos">Todos os status</option>
                  <option value="ativo">Só ativos</option>
                  <option value="bloqueado">Só bloqueados</option>
                </select>
              </div>

              {erro && <div className="erro">{erro}</div>}
              {!clientes && !erro && <div className="linha suave"><span className="girando" /> Carregando clientes...</div>}
              {clientes && !lista.length && (
                <div className="cartao vazio">
                  {clientes.length ? (
                    <><h3>Nada por aqui</h3><p className="suave">Nenhum cliente com esse filtro.</p></>
                  ) : (
                    <><h3>Nenhum cliente ainda</h3><p className="suave">Crie o primeiro acesso em "Novo cliente".</p></>
                  )}
                </div>
              )}
              <div className="grade">
                {lista.map((c) => (
                  <CartaoCliente key={c.id} c={c}
                    onEditar={(c) => setModal({ tipo: 'editar', dados: c })}
                    onSenha={(d) => setModal({ tipo: 'senha', dados: d })} />
                ))}
              </div>
            </div>
          </main>

          {modal?.tipo === 'novo' && <FormCliente onFechar={fechar} onCriado={(d) => setModal({ tipo: 'senha', dados: d })} />}
          {modal?.tipo === 'editar' && <FormCliente cliente={modal.dados} onFechar={fechar} />}
          {modal?.tipo === 'senha' && <SenhaGerada dados={modal.dados} onFechar={fechar} />}
        </>
      );
    }

    // ==========================================================
    // Área do cliente (Fase 1: só a entrada; DNA e geração vêm nas próximas fases)
    // ==========================================================
    // Guia operacional da fase de testes. Texto revisado contra a lista da trava anti-IA.
    function GuiaDeTeste({ crescimento }) {
      const vencedor = crescimento?.fase === 'vencedor_definido' ? crescimento.vencedor : null;
      return (
        <section className="cartao">
          <div className="faixa" />
          <div className="guia stack-lg">
            <div className="stack">
              <span className="sobretitulo">{vencedor ? 'Seu formato vencedor' : 'Fase atual: testando formatos'}</span>
              <h2>{vencedor ? 'Você já achou o que funciona para o seu perfil' : 'Como crescer no começo: testando formatos'}</h2>
              {vencedor ? (
                <div className="destaque-vencedor">
                  <strong>{resumoVencedor(vencedor)}</strong>
                  {vencedor.observacao && <p style={{ marginTop: 6 }}>{vencedor.observacao}</p>}
                  <p className="peq suave" style={{ marginTop: 8 }}>
                    Seus próximos roteiros vão priorizar esse caminho. Continue testando ganchos em todo conteúdo, porque o gancho é o que mais muda o alcance.
                  </p>
                </div>
              ) : (
                <>
                  <p className="suave">
                    No começo ainda não dá para saber qual formato funciona melhor para o seu perfil. Por isso a primeira fase é de teste.
                    Alguns conteúdos vão bater 1 visualização. Outros vão viralizar e trazer seguidores. Faz parte do processo:
                    cada resultado anotado aqui mostra o caminho até o seu formato vencedor.
                  </p>
                  <p className="suave">A equipe da Visions acompanha seus números e avisa quando o vencedor aparecer.</p>
                </>
              )}
            </div>

            <div className="stack">
              <h3>Como testar cada conteúdo</h3>
              <ol className="passos">
                <li><strong>Grave o vídeo inteiro uma vez</strong> com o primeiro gancho. Todo roteiro vem com 5 ganchos diferentes.</li>
                <li><strong>Grave só os 3 primeiros segundos</strong> com cada um dos outros 4 ganchos e monte 5 versões do mesmo vídeo.</li>
                <li><strong>Publique as versões como Reels de teste.</strong> Na tela de compartilhar do Reels, ative a opção de teste: o vídeo aparece primeiro para quem ainda não te segue. A opção aparece em contas profissionais (criador ou empresa).</li>
                <li><strong>Espere de 24 a 72 horas</strong> e compare as visualizações e a retenção nos 3 primeiros segundos de cada versão.</li>
                <li><strong>Compartilhe a melhor versão com seus seguidores</strong> e registre aqui qual gancho venceu.</li>
                <li><strong>Se nenhum gancho performar</strong>, abra a retenção do vídeo no Instagram, veja o segundo em que a visualização caiu e mude o roteiro só naquele trecho. Depois teste de novo.</li>
              </ol>
            </div>

            <div className="stack">
              <h3>Regras para o teste dar resposta</h3>
              <ul className="regras">
                <li><strong>Mude 1 coisa por vez.</strong> Se trocar o gancho e o formato juntos, você não descobre qual dos dois fez diferença.</li>
                <li><strong>1 assunto por conteúdo.</strong> Dois temas no mesmo vídeo dividem a atenção e derrubam a retenção.</li>
                <li><strong>Para crescer a base, no máximo 1min30.</strong> Conteúdos mais longos ficam para menos vezes, quando o objetivo for aprofundar.</li>
                <li><strong>Reaproveite a cada 3 meses.</strong> Postando com constância, chega gente nova o tempo todo: o conteúdo que foi bem volta com um gancho novo.</li>
              </ul>
            </div>
          </div>
        </section>
      );
    }

    // ==========================================================
    // Fase 2: DNA do perfil
    // ==========================================================
    const DESTINOS_VENDA = { direct: 'Direct do Instagram', whatsapp: 'WhatsApp', link_bio: 'Link na bio', formulario: 'Formulário', loja: 'Loja (física ou online)' };
    const EIXOS = [
      { id: 'tecnicoProximo', a: 'Técnico', b: 'Próximo', dica: 'Fala como especialista ou como amiga?' },
      { id: 'serioIrreverente', a: 'Sério', b: 'Irreverente', dica: 'Tem espaço para piada e ironia?' },
      { id: 'formalInformal', a: 'Formal', b: 'Informal', dica: 'Escreve "você" e "a gente", ou mais certinho?' },
      { id: 'calmoIntenso', a: 'Calmo', b: 'Intenso', dica: 'Tom de conversa tranquila ou de energia lá em cima?' },
    ];
    const MIN_EXEMPLOS = 3;
    const MAX_EXEMPLOS = 5;
    const MIN_CARACTERES_EXEMPLO = 40;
    const exemplosValidos = (dna) => (dna?.tom?.exemplosReais || []).filter((e) => (e || '').trim().length >= MIN_CARACTERES_EXEMPLO);

    // Mesma regra de functions/dna.js (faltandoNoDna).
    function faltandoNoDna(dna) {
      const f = [];
      const n = dna?.negocio || {};
      if (!n.oQueFaz?.trim()) f.push('o que você faz');
      if (!n.paraQuem?.trim()) f.push('para quem');
      if (!DESTINOS_VENDA[n.destinoVenda]) f.push('onde a venda acontece');
      const eixos = dna?.tom?.eixos || {};
      if (EIXOS.some((e) => !(eixos[e.id] >= 1 && eixos[e.id] <= 5))) f.push('os eixos do tom');
      if (exemplosValidos(dna).length < MIN_EXEMPLOS) f.push(`${MIN_EXEMPLOS} exemplos reais`);
      if (!dna?.tom?.perfilDeVozExtraido?.trim()) f.push('o perfil de voz');
      if (!dna?.temaPrincipal?.trim()) f.push('o tema principal');
      if (!(dna?.subtemas || []).some((s) => s?.trim())) f.push('pelo menos 1 subtema');
      return f;
    }

    function useDna(uid) {
      const [dna, setDna] = useState(undefined);
      useEffect(() => db.doc(`clientes/${uid}/dna/atual`).onSnapshot(
        (s) => setDna(s.exists ? s.data() : null),
        () => setDna(null)
      ), [uid]);
      return dna;
    }

    async function salvarDna(uid, parcial) {
      await db.doc(`clientes/${uid}/dna/atual`).set({ ...parcial, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    }

    function Etiquetas({ id, valor = [], onChange, placeholder, max = 30 }) {
      const [texto, setTexto] = useState('');
      function adicionar() {
        const novos = texto.split(/[,;\n]/).map((t) => t.trim()).filter(Boolean)
          .filter((t) => !valor.some((v) => v.toLowerCase() === t.toLowerCase()));
        if (novos.length) onChange([...valor, ...novos].slice(0, max));
        setTexto('');
      }
      return (
        <div className="etiquetas">
          {valor.length > 0 && (
            <div className="chips">
              {valor.map((v) => (
                <span className="chip" key={v}>
                  {v}
                  <button type="button" aria-label={`Remover ${v}`} onClick={() => onChange(valor.filter((x) => x !== v))}>×</button>
                </span>
              ))}
            </div>
          )}
          <div className="linha-input">
            <input id={id} value={texto} placeholder={placeholder} onChange={(e) => setTexto(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); adicionar(); } }}
              onBlur={adicionar} disabled={valor.length >= max} />
            <button type="button" className="btn mini" onClick={adicionar} disabled={!texto.trim()}>Adicionar</button>
          </div>
        </div>
      );
    }

    function Eixo({ eixo, valor, onChange }) {
      return (
        <div className="eixo">
          <div className="entre"><strong>{eixo.a}</strong><strong>{eixo.b}</strong></div>
          <div className="escala" role="radiogroup" aria-label={`${eixo.a} a ${eixo.b}`}>
            {[1, 2, 3, 4, 5].map((n) => (
              <button type="button" key={n} role="radio" aria-checked={valor === n}
                className={valor === n ? 'ativo' : ''} onClick={() => onChange(n)}>{n}</button>
            ))}
          </div>
          <p className="dica">{eixo.dica}</p>
        </div>
      );
    }

    // ---------- campos de cada etapa (usados no onboarding e em "Meu perfil") ----------

    function CamposNegocio({ d, set }) {
      const n = d.negocio || {};
      const mudar = (campo) => (e) => set({ ...d, negocio: { ...n, [campo]: e.target.value } });
      return (
        <div className="stack">
          <div>
            <label htmlFor="n-faz">O que você faz?</label>
            <textarea id="n-faz" rows="2" placeholder="Ex.: Faço bolos de pote e doces para festas em Campinas." value={n.oQueFaz || ''} onChange={mudar('oQueFaz')} />
          </div>
          <div>
            <label htmlFor="n-quem">Para quem?</label>
            <textarea id="n-quem" rows="2" placeholder="Ex.: Mães que organizam a festa dos filhos em casa e não têm tempo de cozinhar." value={n.paraQuem || ''} onChange={mudar('paraQuem')} />
          </div>
          <div>
            <label htmlFor="n-dif">O que te diferencia? <span className="suave">(opcional)</span></label>
            <textarea id="n-dif" rows="2" placeholder="Ex.: Massa sem conservante, entrega no mesmo dia." value={n.diferencial || ''} onChange={mudar('diferencial')} />
          </div>
          <div>
            <label htmlFor="n-oferta">Oferta principal <span className="suave">(opcional)</span></label>
            <input id="n-oferta" placeholder="Ex.: Kit festa com 30 bolos de pote" value={n.ofertaPrincipal || ''} onChange={mudar('ofertaPrincipal')} />
          </div>
          <div>
            <label htmlFor="n-destino">Onde a venda acontece?</label>
            <select id="n-destino" value={n.destinoVenda || ''} onChange={mudar('destinoVenda')}>
              <option value="">Escolha</option>
              {Object.entries(DESTINOS_VENDA).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
            </select>
            <p className="dica">É para lá que os roteiros de venda vão levar quem assiste.</p>
          </div>
        </div>
      );
    }

    function CamposTom({ d, set }) {
      const eixos = d.tom?.eixos || {};
      return (
        <div className="stack-lg">
          {EIXOS.map((e) => (
            <Eixo key={e.id} eixo={e} valor={eixos[e.id]}
              onChange={(v) => set({ ...d, tom: { ...(d.tom || {}), eixos: { ...eixos, [e.id]: v } } })} />
          ))}
        </div>
      );
    }

    function CamposExemplos({ d, set }) {
      const exemplos = d.tom?.exemplosReais?.length ? d.tom.exemplosReais : ['', '', ''];
      const mudar = (lista) => set({ ...d, tom: { ...(d.tom || {}), exemplosReais: lista } });
      return (
        <div className="stack">
          {exemplos.map((ex, i) => (
            <div key={i}>
              <div className="entre" style={{ marginBottom: 7 }}>
                <label htmlFor={`ex-${i}`} style={{ margin: 0 }}>Exemplo {i + 1}</label>
                {exemplos.length > MIN_EXEMPLOS && (
                  <button type="button" className="btn texto peq" onClick={() => mudar(exemplos.filter((_, j) => j !== i))}>Remover</button>
                )}
              </div>
              <textarea id={`ex-${i}`} rows="5" value={ex} placeholder="Cole aqui uma legenda sua ou a transcrição de um vídeo em que você fala."
                onChange={(e) => mudar(exemplos.map((x, j) => (j === i ? e.target.value : x)))} />
              {ex.trim() && ex.trim().length < MIN_CARACTERES_EXEMPLO && <p className="dica">Um pouco mais: pelo menos {MIN_CARACTERES_EXEMPLO} caracteres.</p>}
            </div>
          ))}
          {exemplos.length < MAX_EXEMPLOS && (
            <button type="button" className="btn" onClick={() => mudar([...exemplos, ''])}>Adicionar mais um exemplo</button>
          )}
        </div>
      );
    }

    function CamposExpressoes({ d, set }) {
      return (
        <div className="stack-lg">
          <div>
            <label htmlFor="expr">Expressões que você usa de verdade</label>
            <Etiquetas id="expr" valor={d.expressoesQueUsa || []} max={30} placeholder='Ex.: "gente", "olha só", "bora"'
              onChange={(v) => set({ ...d, expressoesQueUsa: v })} />
            <p className="dica">Os roteiros usam no máximo 2 por vez, quando couber. Aperte Enter para adicionar cada uma.</p>
          </div>
          <div>
            <label htmlFor="proib">Palavras que você não quer nos seus roteiros <span className="suave">(opcional)</span></label>
            <Etiquetas id="proib" valor={d.palavrasProibidas || []} max={60} placeholder='Ex.: "gourmet", "imperdível"'
              onChange={(v) => set({ ...d, palavrasProibidas: v })} />
            <p className="dica">Essas palavras são barradas automaticamente em tudo que a plataforma escrever para você.</p>
          </div>
        </div>
      );
    }

    function CamposTema({ d, set }) {
      return (
        <div className="stack-lg">
          <div>
            <label htmlFor="tema">Tema principal</label>
            <input id="tema" placeholder="Ex.: Confeitaria caseira que vende" value={d.temaPrincipal || ''}
              onChange={(e) => set({ ...d, temaPrincipal: e.target.value })} />
          </div>
          <div>
            <label htmlFor="subtemas">Subtemas</label>
            <Etiquetas id="subtemas" valor={d.subtemas || []} max={20} placeholder="Ex.: precificação, bastidores da produção, encomendas"
              onChange={(v) => set({ ...d, subtemas: v })} />
            <p className="dica">Os assuntos que giram em volta do tema principal. Eles orientam as sugestões de tema.</p>
          </div>
        </div>
      );
    }

    function CampoPerfilDeVoz({ uid, d, set, rotuloBotao }) {
      const [gerando, setGerando] = useState(false);
      const [etapa, setEtapa] = useState('');
      const [erro, setErro] = useState('');
      const perfil = d.tom?.perfilDeVozExtraido || '';

      async function gerar() {
        setErro('');
        setGerando(true);
        setEtapa('Lendo seus exemplos...');
        const t = setTimeout(() => setEtapa('Conferindo o texto...'), 6000);
        try {
          // Salva antes para a function ler a versão atual.
          await salvarDna(uid, { tom: { exemplosReais: d.tom?.exemplosReais || [], eixos: d.tom?.eixos || {} }, expressoesQueUsa: d.expressoesQueUsa || [], palavrasProibidas: d.palavrasProibidas || [] });
          const r = await chamar('extrairPerfilDeVoz');
          set({ ...d, tom: { ...(d.tom || {}), perfilDeVozExtraido: r.perfilDeVoz, perfilDeVozPendencias: r.pendencias } });
        } catch (e) {
          setErro(mensagemErro(e));
        }
        clearTimeout(t);
        setGerando(false);
      }

      return (
        <div className="stack">
          {!perfil && !gerando && (
            <p className="suave">Com base nos seus exemplos, a plataforma descreve o seu jeito de escrever: ritmo, tamanho das frases, palavras e marcas de fala. Você revisa e ajusta.</p>
          )}
          {gerando ? (
            <div className="carregando-ia"><span className="girando" /> {etapa}</div>
          ) : (
            <button type="button" className={'btn ' + (perfil ? '' : 'primario')} onClick={gerar}>
              {perfil ? 'Gerar de novo a partir dos exemplos' : (rotuloBotao || 'Gerar meu perfil de voz')}
            </button>
          )}
          {erro && <div className="erro" role="alert">{erro}</div>}
          {perfil && !gerando && (
            <div>
              <label htmlFor="perfil-voz">Seu perfil de voz <span className="suave">(pode editar)</span></label>
              <textarea id="perfil-voz" rows="10" value={perfil}
                onChange={(e) => set({ ...d, tom: { ...(d.tom || {}), perfilDeVozExtraido: e.target.value } })} />
              <p className="dica">É assim que a plataforma vai escrever como você. Se algo não parece seu, corrija aqui.</p>
            </div>
          )}
        </div>
      );
    }

    const ETAPAS = [
      { id: 'negocio', titulo: 'Seu negócio', sub: 'O básico para os roteiros falarem com as pessoas certas.', Campos: CamposNegocio,
        ok: (d) => d.negocio?.oQueFaz?.trim() && d.negocio?.paraQuem?.trim() && DESTINOS_VENDA[d.negocio?.destinoVenda],
        falta: 'Preencha o que você faz, para quem e onde a venda acontece.',
        salvar: (d) => ({ negocio: d.negocio || {} }) },
      { id: 'tom', titulo: 'Seu tom', sub: 'Marque de 1 a 5 onde você está em cada eixo. Não tem certo ou errado.', Campos: CamposTom,
        ok: (d) => EIXOS.every((e) => d.tom?.eixos?.[e.id]),
        falta: 'Marque os 4 eixos.',
        salvar: (d) => ({ tom: { eixos: d.tom?.eixos || {} } }) },
      { id: 'exemplos', titulo: 'Como você escreve', sub: 'Cole de 3 a 5 textos seus: legendas que você escreveu ou a transcrição de um vídeo seu falando. Use só textos seus, do seu jeito.', Campos: CamposExemplos,
        ok: (d) => exemplosValidos(d).length >= MIN_EXEMPLOS,
        falta: `Preciso de pelo menos ${MIN_EXEMPLOS} exemplos com ${MIN_CARACTERES_EXEMPLO} caracteres ou mais.`,
        salvar: (d) => ({ tom: { exemplosReais: (d.tom?.exemplosReais || []).map((e) => e.trim()).filter(Boolean) } }) },
      { id: 'expressoes', titulo: 'Suas palavras', sub: 'O que você fala de verdade, e o que não quer ver de jeito nenhum.', Campos: CamposExpressoes,
        ok: () => true, falta: '',
        salvar: (d) => ({ expressoesQueUsa: d.expressoesQueUsa || [], palavrasProibidas: d.palavrasProibidas || [] }) },
      { id: 'tema', titulo: 'Seu tema', sub: 'Sobre o que o seu perfil fala.', Campos: CamposTema,
        ok: (d) => d.temaPrincipal?.trim() && (d.subtemas || []).length > 0,
        falta: 'Preencha o tema principal e pelo menos 1 subtema.',
        salvar: (d) => ({ temaPrincipal: (d.temaPrincipal || '').trim(), subtemas: d.subtemas || [] }) },
      { id: 'voz', titulo: 'Seu perfil de voz', sub: 'O resumo de como você escreve. É ele que deixa os roteiros com a sua cara.', Campos: null,
        ok: (d) => d.tom?.perfilDeVozExtraido?.trim(),
        falta: 'Gere o seu perfil de voz para concluir.',
        salvar: (d) => ({ tom: { perfilDeVozExtraido: (d.tom?.perfilDeVozExtraido || '').trim() }, onboardingConcluido: true }) },
    ];

    function Onboarding({ uid, cliente, dna }) {
      const [d, setD] = useState(dna || {});
      const [i, setI] = useState(Math.min(dna?.etapaOnboarding || 0, ETAPAS.length - 1));
      const [erro, setErro] = useState('');
      const [salvando, setSalvando] = useState(false);
      const etapa = ETAPAS[i];

      async function avancar() {
        setErro('');
        if (!etapa.ok(d)) return setErro(etapa.falta);
        setSalvando(true);
        try {
          await salvarDna(uid, { ...etapa.salvar(d), etapaOnboarding: Math.max(i + 1, dna?.etapaOnboarding || 0) });
          if (i < ETAPAS.length - 1) {
            setI(i + 1);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            toast('Perfil pronto. Agora os roteiros saem com a sua voz.');
          }
        } catch (e) {
          setErro(mensagemErro(e));
        }
        setSalvando(false);
      }

      return (
        <>
          <Cabecalho>
            <button className="btn fantasma mini" onClick={() => auth.signOut()}>Sair</button>
          </Cabecalho>
          <main className="wrap conteudo estreito stack-lg">
            {i === 0 && (
              <div className="stack">
                <span className="sobretitulo">Bem-vindo(a), {primeiroNome(cliente.nome)}</span>
                <h1>Vamos montar o DNA do seu perfil</h1>
                <p className="suave">São 6 passos rápidos. Com eles, a plataforma escreve roteiros com o seu jeito de falar, e dois perfis do mesmo nicho nunca recebem roteiros parecidos.</p>
              </div>
            )}
            <div className="progresso" aria-label={`Passo ${i + 1} de ${ETAPAS.length}`}>
              {ETAPAS.map((e, j) => (
                <button key={e.id} type="button" className={j < i ? 'feito' : j === i ? 'atual' : ''}
                  disabled={j > (dna?.etapaOnboarding || 0) || salvando} onClick={() => { setErro(''); setI(j); }}
                  aria-label={`Passo ${j + 1}: ${e.titulo}`} />
              ))}
            </div>
            <section className="cartao">
              <div className="faixa" />
              <div className="cartao-corpo stack-lg">
                <div className="stack">
                  <span className="sobretitulo">Passo {i + 1} de {ETAPAS.length}</span>
                  <h2>{etapa.titulo}</h2>
                  <p className="suave">{etapa.sub}</p>
                </div>
                {etapa.Campos ? <etapa.Campos d={d} set={setD} /> : <CampoPerfilDeVoz uid={uid} d={d} set={setD} />}
                {erro && <div className="erro" role="alert">{erro}</div>}
                <div className="entre">
                  {i > 0 ? <button type="button" className="btn fantasma" onClick={() => { setErro(''); setI(i - 1); }} disabled={salvando}>Voltar</button> : <span />}
                  <button type="button" className="btn primario" onClick={avancar} disabled={salvando}>
                    {salvando ? <><span className="girando" /> Salvando...</> : i === ETAPAS.length - 1 ? 'Concluir' : 'Continuar'}
                  </button>
                </div>
              </div>
            </section>
          </main>
        </>
      );
    }

    function MeuPerfil({ uid, dna, onVoltar }) {
      const [d, setD] = useState(dna || {});
      const [salvando, setSalvando] = useState(false);
      const [erro, setErro] = useState('');
      const falta = faltandoNoDna(d);

      async function salvar() {
        setErro('');
        if (exemplosValidos(d).length < MIN_EXEMPLOS) return setErro(`Mantenha pelo menos ${MIN_EXEMPLOS} exemplos reais com ${MIN_CARACTERES_EXEMPLO} caracteres ou mais.`);
        setSalvando(true);
        try {
          const tudo = ETAPAS.reduce((acc, e) => {
            const p = e.salvar(d);
            return { ...acc, ...p, tom: { ...(acc.tom || {}), ...(p.tom || {}) } };
          }, {});
          // No "Meu perfil" as listas são substituídas por inteiro (merge não remove itens de array).
          await db.doc(`clientes/${uid}/dna/atual`).set({ ...dna, ...tudo, tom: { ...(dna?.tom || {}), ...tudo.tom }, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() });
          toast('Perfil salvo.');
          onVoltar();
        } catch (e) {
          setErro(mensagemErro(e));
        }
        setSalvando(false);
      }

      const secoes = [
        ['Seu negócio', <CamposNegocio d={d} set={setD} />],
        ['Seu tom', <CamposTom d={d} set={setD} />],
        ['Como você escreve', <CamposExemplos d={d} set={setD} />],
        ['Suas palavras', <CamposExpressoes d={d} set={setD} />],
        ['Seu tema', <CamposTema d={d} set={setD} />],
        ['Perfil de voz', <CampoPerfilDeVoz uid={uid} d={d} set={setD} />],
      ];

      return (
        <>
          <Cabecalho>
            <button className="btn fantasma mini" onClick={onVoltar}>Voltar</button>
          </Cabecalho>
          <main className="wrap conteudo estreito stack-lg">
            <div className="stack">
              <span className="sobretitulo">DNA do perfil</span>
              <h1>Meu perfil</h1>
              <p className="suave">Tudo que a plataforma sabe sobre você para escrever com a sua voz. Mudou alguma coisa no negócio ou no jeito de falar? Atualize aqui.</p>
            </div>
            {secoes.map(([titulo, campos]) => (
              <section className="cartao" key={titulo}>
                <div className="cartao-corpo stack">
                  <h2>{titulo}</h2>
                  {campos}
                </div>
              </section>
            ))}
            {falta.length > 0 && <div className="aviso">Para gerar roteiros ainda falta: {falta.join(', ')}.</div>}
            {erro && <div className="erro" role="alert">{erro}</div>}
            <div className="barra-acoes">
              <button className="btn" onClick={onVoltar} disabled={salvando}>Cancelar</button>
              <button className="btn primario" onClick={salvar} disabled={salvando}>
                {salvando ? <><span className="girando" /> Salvando...</> : 'Salvar perfil'}
              </button>
            </div>
          </main>
        </>
      );
    }

    function InicioCliente({ cliente }) {
      const dna = useDna(cliente.id);
      const [tela, setTela] = useState('inicio');

      if (dna === undefined) return <Carregando />;
      const falta = faltandoNoDna(dna);
      if (!dna?.onboardingConcluido) return <Onboarding uid={cliente.id} cliente={cliente} dna={dna} />;
      if (tela === 'perfil') return <MeuPerfil uid={cliente.id} dna={dna} onVoltar={() => setTela('inicio')} />;

      return (
        <>
          <Cabecalho>
            <button className="btn fantasma mini" onClick={() => setTela('perfil')}>Meu perfil</button>
            <button className="btn fantasma mini" onClick={() => auth.signOut()}>Sair</button>
          </Cabecalho>
          <main className="wrap conteudo stack-lg">
            <div className="cartao">
              <div className="boas-vindas stack">
                <span className="sobretitulo">Sua área</span>
                <h1>Olá, <em>{primeiroNome(cliente.nome)}</em>.</h1>
                {falta.length ? (
                  <div className="aviso entre">
                    <span>Para gerar roteiros, complete seu perfil. Falta: {falta.join(', ')}.</span>
                    <button className="btn mini" onClick={() => setTela('perfil')}>Completar</button>
                  </div>
                ) : (
                  <p className="suave" style={{ maxWidth: 560 }}>
                    Seu perfil de voz está pronto. A criação de roteiros chega na próxima atualização da plataforma.
                  </p>
                )}
                <div className="linha">
                  <button className="btn primario" disabled title={falta.length ? 'Complete seu perfil primeiro' : 'Disponível na próxima atualização'}>Criar roteiro</button>
                  <button className="btn" onClick={() => setTela('perfil')}>Ver meu perfil</button>
                </div>
              </div>
            </div>
            <GuiaDeTeste crescimento={cliente.crescimento} />
          </main>
        </>
      );
    }

    // ==========================================================
    // App: decide a tela e vigia o status do cliente em tempo real
    // ==========================================================
    function App() {
      const [estado, setEstado] = useState({ fase: 'carregando' });
      const [suspenso, setSuspenso] = useState(false);

      useEffect(() => {
        let pararCliente = null;
        const pararAuth = auth.onAuthStateChanged(async (u) => {
          if (pararCliente) { pararCliente(); pararCliente = null; }
          if (!u) return setEstado({ fase: 'login' });

          setEstado({ fase: 'carregando' });
          let token;
          try {
            token = await u.getIdTokenResult();
          } catch (e) {
            // Token revogado ou usuário desativado.
            if (ehSuspensao(e) || e?.code === 'auth/user-token-expired') setSuspenso(true);
            await auth.signOut();
            return;
          }
          if (token.claims.admin === true) return setEstado({ fase: 'admin', usuario: u });
          // Admin marcado pelo Console (documento admins/{uid}).
          try {
            const adm = await db.doc(`admins/${u.uid}`).get();
            if (adm.exists) return setEstado({ fase: 'admin', usuario: u });
          } catch {
            // Sem permissão ou sem rede: segue como cliente.
          }

          // Cliente: escuta o próprio documento. Se o status mudar ou a leitura for negada, sai.
          pararCliente = db.doc(`clientes/${u.uid}`).onSnapshot(
            (snap) => {
              const c = snap.data();
              if (!snap.exists || c.status !== 'ativo') {
                setSuspenso(true);
                auth.signOut();
                return;
              }
              setEstado({ fase: 'cliente', usuario: u, cliente: { id: snap.id, ...c } });
            },
            (e) => {
              if (ehSuspensao(e)) setSuspenso(true);
              else toast(mensagemErro(e));
              auth.signOut();
            }
          );
        });
        return () => { pararAuth(); if (pararCliente) pararCliente(); };
      }, []);

      let tela;
      if (suspenso && estado.fase !== 'admin' && estado.fase !== 'cliente') {
        tela = <AcessoSuspenso onVoltar={() => setSuspenso(false)} />;
      } else if (estado.fase === 'carregando') {
        tela = <Carregando />;
      } else if (estado.fase === 'login') {
        tela = <Login onSuspenso={() => setSuspenso(true)} />;
      } else if (estado.fase === 'admin') {
        tela = <PainelAdmin />;
      } else {
        tela = <InicioCliente cliente={estado.cliente} />;
      }
      return <>{tela}<Toast /></>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
