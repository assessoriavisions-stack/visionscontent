          {gerando ? (
            <div className="carregando-ia"><span className="girando" /> {etapa}</div>
          ) : (
            <button type="button" className={'btn ' + (perfil ? '' : 'primario')} onClick={gerar}>
              {perfil ? 'Gerar de novo a partir dos exemplos' : (rotuloBotao || 'Gerar meu perfil de voz')}
            </button>
          )}
          {erro && <div className="erro" role="alert">{erro}</div>}
          {perfil && !gerando && (
            <div>
              <label htmlFor="perfil-voz">Seu perfil de voz <span className="suave">(pode editar)</span></label>
              <textarea id="perfil-voz" rows="10" value={perfil}
                onChange={(e) => set({ ...d, tom: { ...(d.tom || {}), perfilDeVozExtraido: e.target.value } })} />
              <p className="dica">É assim que a plataforma vai escrever como você. Se algo não parece seu, corrija aqui.</p>
            </div>
          )}
        </div>
      );
    }

    const ETAPAS = [
      { id: 'negocio', titulo: 'Seu negócio', sub: 'O básico para os roteiros falarem com as pessoas certas.', Campos: CamposNegocio,
        ok: (d) => d.negocio?.oQueFaz?.trim() && d.negocio?.paraQuem?.trim() && DESTINOS_VENDA[d.negocio?.destinoVenda],
        falta: 'Preencha o que você faz, para quem e onde a venda acontece.',
        salvar: (d) => ({ negocio: d.negocio || {} }) },
      { id: 'produtos', titulo: 'O que você vende', sub: 'Seus produtos ou serviços. Os roteiros de venda usam isso e nunca inventam preço.', Campos: CamposProdutos,
        ok: (d) => (d.produtos || []).some((p) => p.nome?.trim()),
        falta: 'Cadastre pelo menos 1 produto ou serviço (o nome já basta).',
        salvar: (d) => ({ produtos: limparProdutos(d.produtos) }) },
      { id: 'tom', titulo: 'Seu tom', sub: 'Marque de 1 a 5 onde você está em cada eixo. Não tem certo ou errado.', Campos: CamposTom,
        ok: (d) => EIXOS.every((e) => d.tom?.eixos?.[e.id]),
        falta: 'Marque os 4 eixos.',
        salvar: (d) => ({ tom: { eixos: d.tom?.eixos || {} } }) },
      { id: 'exemplos', titulo: 'Como você escreve', sub: 'Cole de 3 a 5 textos seus: legendas que você escreveu ou a transcrição de um vídeo seu falando. Use só textos seus, do seu jeito.', Campos: CamposExemplos,
        ok: (d) => exemplosValidos(d).length >= MIN_EXEMPLOS,
        falta: `Preciso de pelo menos ${MIN_EXEMPLOS} exemplos com ${MIN_CARACTERES_EXEMPLO} caracteres ou mais.`,
        salvar: (d) => ({ tom: { exemplosReais: (d.tom?.exemplosReais || []).map((e) => e.trim()).filter(Boolean) } }) },
      { id: 'expressoes', titulo: 'Suas palavras', sub: 'O que você fala de verdade, e o que não quer ver de jeito nenhum.', Campos: CamposExpressoes,
        ok: () => true, falta: '',
        salvar: (d) => ({ expressoesQueUsa: d.expressoesQueUsa || [], palavrasProibidas: d.palavrasProibidas || [] }) },
      { id: 'tema', titulo: 'Seu tema', sub: 'Sobre o que o seu perfil fala.', Campos: CamposTema,
        ok: (d) => d.temaPrincipal?.trim() && (d.subtemas || []).length > 0,
        falta: 'Preencha o tema principal e pelo menos 1 subtema.',
        salvar: (d) => ({ temaPrincipal: (d.temaPrincipal || '').trim(), subtemas: d.subtemas || [] }) },
      { id: 'voz', titulo: 'Seu perfil de voz', sub: 'O resumo de como você escreve. É ele que deixa os roteiros com a sua cara.', Campos: null,
        ok: (d) => d.tom?.perfilDeVozExtraido?.trim(),
        falta: 'Gere o seu perfil de voz para concluir.',
        salvar: (d) => ({ tom: { perfilDeVozExtraido: (d.tom?.perfilDeVozExtraido || '').trim() }, onboardingConcluido: true }) },
    ];

    function Onboarding({ uid, cliente, dna }) {
      const [d, setD] = useState(dna || {});
      const [i, setI] = useState(Math.min(dna?.etapaOnboarding || 0, ETAPAS.length - 1));
      const [erro, setErro] = useState('');
      const [salvando, setSalvando] = useState(false);
      const etapa = ETAPAS[i];

      async function avancar() {
        setErro('');
        if (!etapa.ok(d)) return setErro(etapa.falta);
        setSalvando(true);
        try {
          await salvarDna(uid, { ...etapa.salvar(d), etapaOnboarding: Math.max(i + 1, dna?.etapaOnboarding || 0) });
          if (i < ETAPAS.length - 1) {
            setI(i + 1);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            toast('Perfil pronto. Agora os roteiros saem com a sua voz.');
          }
        } catch (e) {
          setErro(mensagemErro(e));
        }
        setSalvando(false);
      }

      return (
        <>
          <Cabecalho>
            <button className="btn fantasma mini" onClick={() => auth.signOut()}>Sair</button>
          </Cabecalho>
          <main className="wrap conteudo estreito stack-lg">
            {i === 0 && (
              <div className="stack">
                <span className="sobretitulo">Bem-vindo(a), {primeiroNome(cliente.nome)}</span>
                <h1>Vamos montar o DNA do seu perfil</h1>
                <p className="suave">São 7 passos rápidos. Com eles, a plataforma escreve roteiros com o seu jeito de falar, e dois perfis do mesmo nicho nunca recebem roteiros parecidos.</p>
              </div>
            )}
            <div className="progresso" aria-label={`Passo ${i + 1} de ${ETAPAS.length}`}>
              {ETAPAS.map((e, j) => (
                <button key={e.id} type="button" className={j < i ? 'feito' : j === i ? 'atual' : ''}
                  disabled={j > (dna?.etapaOnboarding || 0) || salvando} onClick={() => { setErro(''); setI(j); }}
                  aria-label={`Passo ${j + 1}: ${e.titulo}`} />
              ))}
            </div>
            <section className="cartao">
              <div className="faixa" />
              <div className="cartao-corpo stack-lg">
                <div className="stack">
                  <span className="sobretitulo">Passo {i + 1} de {ETAPAS.length}</span>
                  <h2>{etapa.titulo}</h2>
                  <p className="suave">{etapa.sub}</p>
                </div>
                {etapa.Campos ? <etapa.Campos d={d} set={setD} /> : <CampoPerfilDeVoz uid={uid} d={d} set={setD} />}
                {erro && <div className="erro" role="alert">{erro}</div>}
                <div className="entre">
                  {i > 0 ? <button type="button" className="btn fantasma" onClick={() => { setErro(''); setI(i - 1); }} disabled={salvando}>Voltar</button> : <span />}
                  <button type="button" className="btn primario" onClick={avancar} disabled={salvando}>
                    {salvando ? <><span className="girando" /> Salvando...</> : i === ETAPAS.length - 1 ? 'Concluir' : 'Continuar'}
                  </button>
                </div>
              </div>
            </section>
          </main>
        </>
      );
    }

    function MeuPerfil({ uid, dna, onVoltar }) {
      const [d, setD] = useState(dna || {});
      const [salvando, setSalvando] = useState(false);
      const [erro, setErro] = useState('');
      const falta = faltandoNoDna(d);

      async function salvar() {
        setErro('');
        if (exemplosValidos(d).length < MIN_EXEMPLOS) return setErro(`Mantenha pelo menos ${MIN_EXEMPLOS} exemplos reais com ${MIN_CARACTERES_EXEMPLO} caracteres ou mais.`);
        setSalvando(true);
        try {
          const tudo = ETAPAS.reduce((acc, e) => {
            const p = e.salvar(d);
            return { ...acc, ...p, tom: { ...(acc.tom || {}), ...(p.tom || {}) } };
          }, {});
          // No "Meu perfil" as listas são substituídas por inteiro (merge não remove itens de array).
          await db.doc(`clientes/${uid}/dna/atual`).set({ ...dna, ...tudo, tom: { ...(dna?.tom || {}), ...tudo.tom }, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() });
          toast('Perfil salvo.');
          onVoltar();
        } catch (e) {
          setErro(mensagemErro(e));
        }
        setSalvando(false);
      }

      const secoes = [
        ['Seu negócio', <CamposNegocio d={d} set={setD} />],
        ['Seu tom', <CamposTom d={d} set={setD} />],
        ['Como você escreve', <CamposExemplos d={d} set={setD} />],
        ['Suas palavras', <CamposExpressoes d={d} set={setD} />],
        ['O que você vende', <CamposProdutos d={d} set={setD} />],
        ['Seu tema', <CamposTema d={d} set={setD} />],
        ['Perfil de voz', <CampoPerfilDeVoz uid={uid} d={d} set={setD} />],
      ];

      return (
        <>
          <Cabecalho>
            <button className="btn fantasma mini" onClick={onVoltar}>Voltar</button>
          </Cabecalho>
          <main className="wrap conteudo estreito stack-lg">
            <div className="stack">
              <span className="sobretitulo">DNA do perfil</span>
              <h1>Meu perfil</h1>
              <p className="suave">Tudo que a plataforma sabe sobre você para escrever com a sua voz. Mudou alguma coisa no negócio ou no jeito de falar? Atualize aqui.</p>
            </div>
            {secoes.map(([titulo, campos]) => (
              <section className="cartao" key={titulo}>
                <div className="cartao-corpo stack">
                  <h2>{titulo}</h2>
                  {campos}
                </div>
              </section>
            ))}
            {falta.length > 0 && <div className="aviso">Para gerar roteiros ainda falta: {falta.join(', ')}.</div>}
            {erro && <div className="erro" role="alert">{erro}</div>}
            <div className="barra-acoes">
              <button className="btn" onClick={onVoltar} disabled={salvando}>Cancelar</button>
              <button className="btn primario" onClick={salvar} disabled={salvando}>
                {salvando ? <><span className="girando" /> Salvando...</> : 'Salvar perfil'}
              </button>
            </div>
          </main>
        </>
      );
    }

    // ==========================================================
    // Fase 3: criar roteiro (wizard da seção 8.1) e ver o resultado
    // ==========================================================
    const PILARES = {
      P1: { nome: 'P1 · Atração', objetivo: 'Atrair quem ainda não te conhece e aumentar a base', kpi: 'Compartilhamento', estilos: ['analise', 'pauta_quente', 'cultura_pop'] },
      P2: { nome: 'P2 · Venda', objetivo: 'Vender', kpi: 'Conversão (direct, link, mensagem)', estilos: ['historia', 'prova_social', 'tecnico', 'transformacao'] },
      P3: { nome: 'P3 · Fidelização', objetivo: 'Fidelizar quem já te segue', kpi: 'Comentários, curtidas e salvamentos', estilos: ['noticia', 'analise', 'desejo', 'opiniao'] },
    };
    const ESTILOS = { analise: 'Análise', pauta_quente: 'Pauta quente', cultura_pop: 'Cultura pop', historia: 'História', prova_social: 'Prova social', tecnico: 'Técnico', transformacao: 'Transformação', noticia: 'Notícia', desejo: 'Desejo', opiniao: 'Opinião', bastidor: 'Bastidor', interacao: 'Enquete / caixinha' };
    const PARA_QUE_SERVE = {
      P1: 'Para quem ainda não te segue. O post precisa ser bom de compartilhar: quem assiste manda para alguém.',
      P2: 'Para quem já te acompanha e está perto de comprar. O post leva para o direct, o link ou o WhatsApp.',
      P3: 'Para quem já te segue. O post gera conversa, salvamento e confiança.',
    };
    const OBJETIVOS_PERFIL = {
      crescer: { nome: 'Crescer o perfil', descricao: 'Alcançar gente nova e ganhar seguidores', mix: { P1: 60, P2: 15, P3: 25 } },
      autoridade: { nome: 'Aumentar a autoridade', descricao: 'Ser lembrada como referência no assunto', mix: { P1: 30, P2: 20, P3: 50 } },
      vender: { nome: 'Vender com o perfil', descricao: 'Transformar seguidores em clientes', mix: { P1: 25, P2: 50, P3: 25 } },
    };
    const mixDoCliente = (objetivo, cliente) => (OBJETIVOS_PERFIL[objetivo] ? (cliente?.mixPersonalizado?.[objetivo] || OBJETIVOS_PERFIL[objetivo].mix) : null);

    // Roteiros criados no mês atual, por pilar.
    function useContagemDoMes(uid) {
      const [c, setC] = useState(null);
      useEffect(() => {
        // Conta os posts PUBLICADOS no mês (marcados como postados).
        return db.collection(`clientes/${uid}/posts`).where('mes', '==', mesReferencia()).onSnapshot((snap) => {
          const x = { P1: 0, P2: 0, P3: 0, total: 0 };
          snap.docs.forEach((d) => { const p = d.data().pilar; if (x[p] !== undefined) { x[p]++; x.total++; } });
          setC(x);
        }, () => setC({ P1: 0, P2: 0, P3: 0, total: 0 }));
      }, [uid]);
      return c;
    }

    // O pilar que mais está faltando para chegar na mistura do objetivo.
    function pilarSugerido(mix, contagem) {
      if (!mix || !contagem) return null;
      const proximoTotal = contagem.total + 1;
      return ['P1', 'P2', 'P3'].map((p) => ({ p, falta: (mix[p] / 100) * proximoTotal - contagem[p] }))
        .sort((a, b) => b.falta - a.falta)[0].p;
    }

    function MisturaDoMes({ mix, contagem }) {
      if (!mix || !contagem) return null;
      return (
        <div className="mistura">
          {['P1', 'P2', 'P3'].map((p) => {
            const feito = contagem.total ? Math.round((contagem[p] / contagem.total) * 100) : 0;
            return (
              <div className="mistura-linha" key={p}>
                <div className="entre peq"><span><strong>{PILARES[p].nome}</strong></span><span className="num suave">{contagem[p]} postado{contagem[p] === 1 ? '' : 's'} · {feito}% de {mix[p]}%</span></div>
                <div className="barra-dupla"><i className="meta" style={{ width: mix[p] + '%' }} /><i className="feito" style={{ width: Math.min(feito, 100) + '%' }} /></div>
              </div>
            );
          })}
        </div>
      );
    }

    const FORMATOS_INFO = {
      reels: 'Fura a bolha: alcança quem ainda não te segue.',
      carrossel: 'Alta performance com quem já te segue. Um slide puxa o outro.',
      post_unico: 'Uma ideia, uma headline forte.',
      story_unico: 'Um story para conversar com quem já te segue.',
      sequencia_stories: 'Narrativa e interação com quem já te segue.',
      serie: 'Conteúdo em partes. Cada parte puxa a próxima.',
    };
    const ESTILOS_POR_FORMATO = {
      post_unico: ['analise', 'opiniao', 'desejo', 'prova_social', 'noticia'],
      story_unico: ['historia', 'bastidor', 'prova_social', 'opiniao', 'desejo', 'interacao', 'tecnico'],
      sequencia_stories: ['historia', 'bastidor', 'prova_social', 'opiniao', 'desejo', 'interacao', 'tecnico'],
    };
    const FORMATOS_STORY = ['story_unico', 'sequencia_stories'];
    function estilosValidos(formato, pilar) {
      const f = ESTILOS_POR_FORMATO[formato];
      if (FORMATOS_STORY.includes(formato)) return f;
      const p = PILARES[pilar]?.estilos || [];
      return f ? p.filter((e) => f.includes(e)) : p;
    }
    const FRAMEWORKS = { ADP: 'Antes, Depois, Ponte', AIDA: 'Atenção, Interesse, Desejo, Ação', CCCA: 'Consciência, Compreender, Convicção, Ação' };
    function frameworkSugerido(pilar, estilo) {
      if (pilar === 'P2' && ['transformacao', 'historia', 'prova_social'].includes(estilo)) return 'ADP';
      if (pilar === 'P2' && estilo === 'tecnico') return 'CCCA';
      if (pilar === 'P3' && estilo === 'analise') return 'CCCA';
      if (pilar === 'P2') return 'ADP';
      return 'AIDA';
    }
    const CTAS = { comentar: 'Comentar palavra-chave', salvar: 'Salvar', enviar: 'Enviar para alguém', link_bio: 'Link na bio', direct: 'Chamar no direct', enquete: 'Responder enquete/caixinha', parte2: 'Seguir para a próxima parte', sem_cta: 'Sem CTA explícito' };
    function ctaSugerido(formato, pilar, destino) {
      if (FORMATOS_STORY.includes(formato)) return 'enquete';
      if (formato === 'serie') return 'parte2';
      if (pilar === 'P1') return 'enviar';
      if (pilar === 'P2') return destino === 'direct' ? 'direct' : 'link_bio';
      return 'comentar';
    }
    const ESTILOS_LEGENDA = { passo_a_passo: 'Passo a passo', explicativa: 'Explicativa', curta_provocativa: 'Curta e provocativa', storytelling: 'Storytelling', lista: 'Lista', pergunta: 'Pergunta para comentários' };
    const TIPOS_BLOCO = { gancho: 'Gancho', contexto: 'Contexto', climax: 'Clímax', apresentacao: 'Apresentação', conteudo: 'Conteúdo', cta: 'Chamada (CTA)', encerramento: 'Encerramento' };
    const TIPOS_FRAME = { fala: 'Fala', texto: 'Texto', foto: 'Foto', video: 'Vídeo', enquete: 'Enquete', caixinha: 'Caixinha', quiz: 'Quiz', link: 'Link' };

    function Opcoes({ opcoes, valor, onEscolher }) {
      return (
        <div className="opcoes">
          {opcoes.map((o) => (
            <button type="button" key={o.id} className={'opcao' + (valor === o.id ? ' ativa' : '')} onClick={() => onEscolher(o.id)}>
              <strong>{o.titulo}</strong>
              {o.texto && <span>{o.texto}</span>}
              {o.selo && <em>{o.selo}</em>}
            </button>
          ))}
        </div>
      );
    }

    function CriarRoteiro({ dna, estrategia, mix, contagem, objetivoPerfil, onPronto, onVoltar }) {
      const [e, setE] = useState({});
      const [passo, setPasso] = useState('formato');
      const [temas, setTemas] = useState(null);
      const [buscandoTemas, setBuscandoTemas] = useState(false);
      const [gerando, setGerando] = useState(false);
      const [etapaGeracao, setEtapaGeracao] = useState('');
      const [erro, setErro] = useState('');
      const [revisando, setRevisando] = useState(false); // veio do "Revisar" para mudar um item

      const temVisual = ['reels', 'serie'].includes(e.formato);
      const ehStory = FORMATOS_STORY.includes(e.formato);
      const passos = ['formato', 'pilar', 'estilo', 'angulo', 'tema', 'framework', ...(temVisual ? ['visual'] : []), 'cta', 'revisar'];
      const rotulos = {
        formato: e.formato && FORMATOS[e.formato], pilar: e.pilar && PILARES[e.pilar].nome, estilo: e.estilo && ESTILOS[e.estilo],
        angulo: e.angulo && ANGULOS[e.angulo], tema: e.tema, framework: e.framework, visual: e.formatoVisual && FORMATOS_VISUAIS[e.formatoVisual],
        cta: e.cta && CTAS[e.cta],
      };
      const nomesPasso = { formato: 'Formato', pilar: 'Pilar', estilo: 'Estilo', angulo: 'Ângulo', tema: 'Tema', framework: 'Framework', visual: 'Formato visual', cta: 'CTA e legenda', revisar: 'Revisar' };
      const ir = (p) => { setErro(''); setPasso(p); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      const proximo = (atual, extra = {}) => {
        const novo = { ...e, ...extra };
        const lista = ['formato', 'pilar', 'estilo', 'angulo', 'tema', 'framework', ...(['reels', 'serie'].includes(novo.formato) ? ['visual'] : []), 'cta', 'revisar'];
        // Normal: próximo passo da lista. Vindo do "Revisar": volta para lá (ou para o que ficou sem resposta).
        const idx = lista.indexOf(atual);
        if (revisando) {
          const falta = lista.find((p) => p !== 'revisar' && !respondido(p, novo));
          ir(falta || 'revisar');
        } else {
          ir(lista[idx + 1] || 'revisar');
        }
      };
      function respondido(p, x) {
        if (p === 'formato') return !!x.formato;
        if (p === 'pilar') return !!x.pilar;
        if (p === 'estilo') return !!x.estilo;
        if (p === 'angulo') return !!x.angulo;
        if (p === 'tema') return !!x.tema?.trim();
        if (p === 'framework') return !!x.framework;
        if (p === 'visual') return !!x.formatoVisual;
        if (p === 'cta') return !!x.cta && (FORMATOS_STORY.includes(x.formato) || !!x.estiloLegenda);
        return true;
      }
      function escolher(campo, valor, extra = {}) {
        let novo = { ...e, [campo]: valor, ...extra };
        // Mudou formato ou pilar: estilo inválido sai; framework e CTA voltam para a sugestão.
        if ((campo === 'formato' || campo === 'pilar') && novo.estilo && novo.pilar && novo.formato && !estilosValidos(novo.formato, novo.pilar).includes(novo.estilo)) novo.estilo = undefined;
        if (campo === 'formato' && !['reels', 'serie'].includes(valor)) novo.formatoVisual = undefined;
        if (['formato', 'pilar', 'estilo'].includes(campo) && novo.pilar && novo.estilo) novo.framework = frameworkSugerido(novo.pilar, novo.estilo);
        if (['formato', 'pilar'].includes(campo) && novo.formato && novo.pilar) novo.cta = ctaSugerido(novo.formato, novo.pilar, dna?.negocio?.destinoVenda);
        if (campo === 'formato' || campo === 'pilar' || campo === 'estilo' || campo === 'angulo') setTemas(null);
        setE(novo);
        return novo;
      }

      async function sugerirTemas() {
        setErro('');
        setBuscandoTemas(true);
        try {
          const r = await chamar('sugerirTemas', { formato: e.formato, pilar: e.pilar, estilo: e.estilo, angulo: e.angulo, editoria: e.editoria || null }, { timeout: 300000 });
          setTemas(r.temas);
        } catch (err) {
          setErro(mensagemErro(err));
        }
        setBuscandoTemas(false);
      }

      async function gerar() {
        setErro('');
        setGerando(true);
        setEtapaGeracao('Escrevendo seu roteiro...');
        const t1 = setTimeout(() => setEtapaGeracao('Conferindo o texto...'), 25000);
        const t2 = setTimeout(() => setEtapaGeracao('Ajustando os últimos detalhes...'), 60000);
        try {
          const r = await chamar('gerarRoteiro', { ...e, formatoVisual: temVisual ? e.formatoVisual : null, estiloLegenda: ehStory ? null : e.estiloLegenda }, { timeout: 540000 });
          onPronto(r.id);
        } catch (err) {
          setErro(mensagemErro(err));
          setGerando(false);
        }
        clearTimeout(t1);
        clearTimeout(t2);
      }

      if (gerando) {
        return (
          <div className="tela-centro">
            <div className="cartao" style={{ width: '100%', maxWidth: 420 }}>
              <div className="faixa" />
              <div className="cartao-corpo stack" style={{ textAlign: 'center' }}>
                <span className="girando grande" style={{ margin: '8px auto' }} />
                <h2>{etapaGeracao}</h2>
                <p className="suave peq">Pode levar até 1 minuto. Não feche esta tela.</p>
              </div>
            </div>
          </div>
        );
      }

      let corpo;
      if (passo === 'formato') {
        corpo = <Opcoes valor={e.formato} onEscolher={(v) => proximo('formato', escolher('formato', v))}
          opcoes={['reels', 'carrossel', 'post_unico', 'serie', 'sequencia_stories', 'story_unico'].map((id) => ({ id, titulo: FORMATOS[id], texto: FORMATOS_INFO[id] }))} />;
      } else if (passo === 'pilar') {
        const sugerido = pilarSugerido(mix, contagem);
        corpo = (
          <div className="stack">
            {mix ? (
              <p className="suave peq">
                Seu objetivo em {nomeDoMesRef(mesReferencia())} é <strong style={{ color: 'var(--tinta)' }}>{OBJETIVOS_PERFIL[objetivoPerfil].nome.toLowerCase()}</strong>.
                {sugerido && <> Pela mistura do mês, o que mais está faltando é <strong style={{ color: 'var(--tinta)' }}>{PILARES[sugerido].nome}</strong>.</>}
              </p>
            ) : (
              <p className="suave peq">Defina o objetivo do perfil no foco do mês para a plataforma sugerir o pilar que está faltando.</p>
            )}
            <Opcoes valor={e.pilar} onEscolher={(v) => proximo('pilar', escolher('pilar', v))}
              opcoes={Object.entries(PILARES).map(([id, p]) => ({
                id, titulo: p.nome,
                texto: `${PARA_QUE_SERVE[id]} Mede: ${p.kpi.toLowerCase()}.`,
                selo: mix ? `${id === sugerido ? 'Sugerido · ' : ''}meta ${mix[id]}% do mês · postados ${contagem?.[id] ?? 0}` : null,
              }))} />
            <MisturaDoMes mix={mix} contagem={contagem} />
          </div>
        );
      } else if (passo === 'estilo') {
        corpo = <Opcoes valor={e.estilo} onEscolher={(v) => proximo('estilo', escolher('estilo', v))}
          opcoes={estilosValidos(e.formato, e.pilar).map((id) => ({ id, titulo: ESTILOS[id] }))} />;
      } else if (passo === 'angulo') {
        corpo = <Opcoes valor={e.angulo} onEscolher={(v) => proximo('angulo', escolher('angulo', v))}
          opcoes={Object.entries(ANGULOS).map(([id, titulo]) => ({ id, titulo }))} />;
      } else if (passo === 'tema') {
        corpo = (
          <div className="stack">
            <div>
              <label htmlFor="tema-conteudo">Sobre o que é este conteúdo?</label>
              <textarea id="tema-conteudo" rows="2" placeholder="Ex.: por que o bolo de pote murcha depois de 2 dias" value={e.tema || ''}
                onChange={(ev) => setE({ ...e, tema: ev.target.value, temaSugeridoPelaIA: false })} />
              <p className="dica">1 assunto só. Quanto mais específico, melhor o roteiro.</p>
            </div>
            {estrategia?.editorias?.length > 0 && (
              <div>
                <label htmlFor="editoria">Editoria <span className="suave">(opcional)</span></label>
                <select id="editoria" value={e.editoria || ''} onChange={(ev) => { setE({ ...e, editoria: ev.target.value || null }); setTemas(null); }}>
                  <option value="">Nenhuma em especial</option>
                  {estrategia.editorias.filter((x) => !x.pilar || x.pilar === e.pilar).map((x) => <option key={x.nome} value={x.nome}>{x.nome}</option>)}
                </select>
              </div>
            )}
            <button type="button" className="btn" onClick={sugerirTemas} disabled={buscandoTemas}>
              {buscandoTemas ? <><span className="girando" /> Pensando em temas...</> : temas ? 'Sugerir outros temas' : 'Sugerir temas'}
            </button>
            {temas && (
              <Opcoes valor={e.temaSugeridoPelaIA ? e.tema : null}
                onEscolher={(v) => setE({ ...e, tema: v, temaSugeridoPelaIA: true })}
                opcoes={temas.map((t) => ({ id: t.tema, titulo: t.tema, texto: t.porQue }))} />
            )}
            <div className="entre">
              <span />
              <button type="button" className="btn primario" onClick={() => (e.tema?.trim()?.length >= 3 ? proximo('tema') : setErro('Escreva o tema ou escolha uma sugestão.'))}>Continuar</button>
            </div>
          </div>
        );
      } else if (passo === 'framework') {
        corpo = (
          <div className="stack">
            <p className="suave peq">Já vem marcado o que mais combina com o pilar e o estilo. Pode trocar.</p>
            <Opcoes valor={e.framework} onEscolher={(v) => proximo('framework', escolher('framework', v))}
              opcoes={Object.entries(FRAMEWORKS).map(([id, texto]) => ({ id, titulo: id, texto, selo: id === frameworkSugerido(e.pilar, e.estilo) ? 'Sugerido' : null }))} />
          </div>
        );
      } else if (passo === 'visual') {
        corpo = <Opcoes valor={e.formatoVisual} onEscolher={(v) => proximo('visual', escolher('formatoVisual', v))}
          opcoes={Object.entries(FORMATOS_VISUAIS).map(([id, titulo]) => ({ id, titulo }))} />;
      } else if (passo === 'cta') {
        corpo = (
          <div className="stack-lg">
            <div>
              <label htmlFor="cta">Chamada para ação (CTA)</label>
              <select id="cta" value={e.cta || ''} onChange={(ev) => setE({ ...e, cta: ev.target.value })}>
                {Object.entries(CTAS).map(([id, t]) => <option key={id} value={id}>{t}{id === ctaSugerido(e.formato, e.pilar, dna?.negocio?.destinoVenda) ? ' (sugerido)' : ''}</option>)}
              </select>
              <p className="dica">O CTA nasce do conteúdo: a plataforma escreve a chamada ligada ao que veio antes.</p>
            </div>
            {!ehStory && (
              <div>
                <label>Estilo de legenda</label>
                <Opcoes valor={e.estiloLegenda} onEscolher={(v) => setE({ ...e, estiloLegenda: v })}
                  opcoes={Object.entries(ESTILOS_LEGENDA).map(([id, titulo]) => ({ id, titulo }))} />
              </div>
            )}
            <div className="entre">
              <span />
              <button type="button" className="btn primario" onClick={() => (respondido('cta', e) ? proximo('cta') : setErro('Escolha o estilo de legenda.'))}>Continuar</button>
            </div>
          </div>
        );
      } else {
        corpo = (
          <div className="stack">
            <dl className="dados resumo">
              {passos.filter((p) => p !== 'revisar').map((p) => (
                <React.Fragment key={p}>
                  <dt>{nomesPasso[p]}</dt>
                  <dd><button type="button" className="btn texto" onClick={() => { setRevisando(true); ir(p); }}>{rotulos[p] || 'escolher'}</button></dd>
                </React.Fragment>
              ))}
              {e.editoria && <><dt>Editoria</dt><dd>{e.editoria}</dd></>}
              {!ehStory && <><dt>Legenda</dt><dd><button type="button" className="btn texto" onClick={() => { setRevisando(true); ir('cta'); }}>{ESTILOS_LEGENDA[e.estiloLegenda] || 'escolher'}</button></dd></>}
            </dl>
            {!ehStory && <p className="suave peq">O roteiro vem com 5 ganchos diferentes para você testar com Reels de teste, e 3 ângulos para contar a mesma história depois.</p>}
            <button type="button" className="btn primario cheio" onClick={gerar} disabled={passos.some((p) => !respondido(p, e))}>Gerar roteiro</button>
          </div>
        );
      }

      const idx = passos.indexOf(passo);
      return (
        <>
          <Cabecalho>
            <button className="btn fantasma mini" onClick={onVoltar}>Cancelar</button>
          </Cabecalho>
          <main className="wrap conteudo estreito stack-lg">
            <div className="stack">
              <span className="sobretitulo">Novo roteiro · passo {idx + 1} de {passos.length}</span>
              <h1>{{ formato: 'Qual formato?', pilar: 'Qual o objetivo deste post?', estilo: 'Qual estilo de roteiro?', angulo: 'Por qual ângulo?', tema: 'Qual o tema?', framework: 'Qual estrutura?', visual: 'Como vai ser gravado?', cta: 'Como termina?', revisar: 'Tudo certo?' }[passo]}</h1>
            </div>
            {idx > 0 && passo !== 'revisar' && (
              <div className="trilha">
                {passos.slice(0, idx).map((p) => rotulos[p] && (
                  <button type="button" key={p} className="chip-trilha" onClick={() => ir(p)} title={`Voltar para ${nomesPasso[p]}`}>
                    <span>{nomesPasso[p]}</span>{String(rotulos[p]).slice(0, 40)}
                  </button>
                ))}
              </div>
            )}
            <section className="cartao"><div className="cartao-corpo">{corpo}</div></section>
            {erro && <div className="erro" role="alert">{erro}</div>}
            {idx > 0 && <button type="button" className="btn fantasma" onClick={() => ir(passos[idx - 1])}>Voltar</button>}
          </main>
        </>
      );
    }

    // ---------- ver o roteiro gerado ----------

    function TextoMarcado({ texto, campo, pendentes }) {
      const meus = (pendentes || []).filter((p) => p.campo === campo && p.trecho);
      if (!texto) return null;
      if (!meus.length) return <>{texto}</>;
      const partes = [];
      let resto = texto;
      let k = 0;
      while (resto) {
        let melhor = null;
        for (const p of meus) {
          const i = resto.indexOf(p.trecho);
          if (i >= 0 && (!melhor || i < melhor.i)) melhor = { i, p };
        }
        if (!melhor) { partes.push(resto); break; }
        partes.push(resto.slice(0, melhor.i));
        partes.push(<mark className="cara-de-ia" key={k++} title="Trecho com cara de IA, reescreva com suas palavras">{melhor.p.trecho}</mark>);
        resto = resto.slice(melhor.i + melhor.p.trecho.length);
      }
      return <>{partes}</>;
    }

    function roteiroParaTexto(r) {
      const c = r.conteudo || {};
      const l = [];
      if (c.nomeSerie) l.push(`${c.nomeSerie} · parte ${r.parteSerie} de ${c.totalPartes}`, '');
      if (c.bigIdea) l.push(`Ideia central: ${c.bigIdea}`, '');
      (c.blocos || []).forEach((b) => {
        l.push(`[${b.tempo}] ${TIPOS_BLOCO[b.tipo] || b.tipo}`, `Fala: ${b.fala}`, `Mostrar: ${b.visual}`);
        if (b.textoTela) l.push(`Texto na tela: ${b.textoTela}`);
        l.push('');
      });
      (c.slides || []).forEach((s) => l.push(`Slide ${s.n}: ${s.texto}`, `Visual: ${s.visual}`, ''));
      if (c.arte) l.push(`Headline: ${c.arte.headline}`, `Apoio: ${c.arte.apoio}`, `Visual: ${c.arte.visual}`, '');
      if (c.objetivoSequencia) l.push(`Objetivo: ${c.objetivoSequencia}`, '');
      (c.frames || []).forEach((f) => { l.push(`Frame ${f.n} (${TIPOS_FRAME[f.tipo] || f.tipo}): ${f.conteudo}`, `Visual: ${f.visual}`); if (f.interacao) l.push(`Interação: ${f.interacao}`); l.push(''); });
      if (c.ganchos?.length) {
        l.push('5 ganchos para testar:');
        c.ganchos.forEach((g) => l.push(`${g.n}. ${g.texto}${g.textoTela ? ` (tela: ${g.textoTela})` : ''}`));
        l.push('');
      }
      if (c.notaProducao) l.push(`Nota de produção: ${c.notaProducao}`, '');
      return l.join('\n').trim();
    }

    // ---------- editor do roteiro (Fase 4) ----------

    // Tem trecho com cara de IA ainda presente no texto atual?
    function temMarcaAtiva(r) {
      const pend = [...(r.trava?.pendentes || []), ...(r.versoes || []).flatMap((v) => v.pendentes || [])];
      return pend.some((p) => {
        const v = p.campo === 'legenda' ? r.legenda : p.campo.split('.').reduce((o, k) => (o == null ? o : o[k]), r.conteudo);
        return typeof v === 'string' && v.includes(p.trecho);
      });
    }

    function TextoEditavel({ valor, onChange, grande }) {
      const ref = React.useRef(null);
      useEffect(() => {
        const t = ref.current;
        if (t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }
      }, [valor]);
      return <textarea ref={ref} className={'editavel' + (grande ? ' grande' : '')} rows="1" value={valor || ''} onChange={(e) => onChange(e.target.value)} />;
    }

    const NOMES_ALVO = { blocos: 'bloco', ganchos: 'gancho', slides: 'slide', frames: 'frame', arte: 'arte', legenda: 'legenda' };
    function descreverVersao(v) {
      if (v.editadoPor === 'cliente') return v.restauradaDe ? 'Você restaurou uma versão anterior' : 'Você editou';
      if (!v.alvo) return 'Roteiro gerado';
      const [l, i] = v.alvo.split('.');
      return `IA regerou ${l === 'legenda' || l === 'arte' ? 'a ' + NOMES_ALVO[l] : `o ${NOMES_ALVO[l]} ${Number(i) + 1}`}`;
    }
    const dataHora = (ts) => (ts?.toDate ? new Intl.DateTimeFormat('pt-BR', { timeZone: FUSO, day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }).format(ts.toDate()) : '');

    // Botão "Regerar" de um bloco, com pedido opcional.
    function Regerar({ uid, roteiroId, alvo, rotulo, ocupado, setOcupado }) {
      const [aberto, setAberto] = useState(false);
      const [pedido, setPedido] = useState('');
      const rodando = ocupado === alvo;
      async function rodar() {
        setOcupado(alvo);
        try {
          await chamar('regerarBloco', { roteiroId, alvo, pedido }, { timeout: 300000 });
          toast(`${rotulo} reescrito.`);
          setAberto(false);
          setPedido('');
        } catch (e) {
          toast(mensagemErro(e));
        }
        setOcupado(null);
      }
      if (rodando) return <div className="regerar-status"><span className="girando" /> Reescrevendo e conferindo...</div>;
      if (!aberto) return <button type="button" className="btn texto peq regerar-btn" disabled={!!ocupado} onClick={() => setAberto(true)}>Regerar {rotulo.toLowerCase()}</button>;
      return (
        <div className="regerar-caixa">
          <input placeholder="O que mudar? Ex.: mais curto, mais engraçado (opcional)" value={pedido} onChange={(e) => setPedido(e.target.value)} maxLength={300}
            onKeyDown={(e) => { if (e.key === 'Enter') rodar(); }} autoFocus />
          <div className="linha">
            <button type="button" className="btn mini primario" onClick={rodar}>Regerar</button>
            <button type="button" className="btn mini fantasma" onClick={() => setAberto(false)}>Cancelar</button>
          </div>
        </div>
      );
    }

    function Historico({ r, onRestaurar, onFechar }) {
      const versoes = [...(r.versoes || [])].map((v, i) => ({ ...v, i })).reverse();
      return (
        <Modal titulo="Histórico" sobretitulo="Últimas 10 versões" onFechar={onFechar}>
          <p className="suave peq">Restaurar não apaga nada: a versão escolhida vira a mais recente.</p>
          <div className="versoes">
            {versoes.map((v, k) => (
              <div className="versao" key={v.i}>
                <div>
                  <strong>{descreverVersao(v)}</strong>
                  <div className="suave peq">{dataHora(v.em)}{k === 0 ? ' · atual' : ''}</div>
                </div>
                {k > 0 && <button className="btn mini" onClick={() => onRestaurar(v)}>Restaurar</button>}
              </div>
            ))}
          </div>
        </Modal>
      );
    }

    function VerRoteiro({ uid, id, onVoltar, onAbrir, onAbrirPost }) {
      const [r, setR] = useState(undefined);
      const [proximaParte, setProximaParte] = useState(null);
      const [gerandoParte, setGerandoParte] = useState(false);
      const [editando, setEditando] = useState(false);
      const [rasc, setRasc] = useState(null); // { conteudo, legenda } em edição
      const [salvando, setSalvando] = useState(false);
      const [ocupado, setOcupado] = useState(null); // alvo sendo regerado
      const [historico, setHistorico] = useState(false);
      const [postando, setPostando] = useState(false);
      useEffect(() => db.doc(`clientes/${uid}/roteiros/${id}`).onSnapshot((s) => setR(s.exists ? { id: s.id, ...s.data() } : null), () => setR(null)), [uid, id]);
      useEffect(() => {
        if (!r?.serieId) return;
        return db.collection(`clientes/${uid}/roteiros`).where('serieId', '==', r.serieId).onSnapshot((s) => {
          const partes = s.docs.map((d) => d.data().parteSerie);
          setProximaParte(Math.max(...partes) === r.parteSerie && r.parteSerie < r.conteudo.totalPartes ? r.parteSerie + 1 : null);
        });
      }, [uid, r?.serieId, r?.parteSerie]);

      if (r === undefined) return <Carregando />;
      if (r === null) return <div className="tela-centro"><div className="stack" style={{ textAlign: 'center' }}><p>Não encontrei esse roteiro.</p><button className="btn" onClick={onVoltar}>Voltar</button></div></div>;

      const editavel = ['rascunho', 'pronto'].includes(r.status);
      const c = editando ? rasc.conteudo : (r.conteudo || {});
      const legenda = editando ? rasc.legenda : r.legenda;
      // Marcas: as atuais e as de versões anteriores (só aparecem se o trecho ainda estiver no texto).
      const pend = [...(r.trava?.pendentes || []), ...(r.versoes || []).flatMap((v) => v.pendentes || [])];
      const copiarTexto = async (t, msg) => toast((await copiar(t)) ? msg : 'Não consegui copiar. Selecione e copie à mão.');

      // Campo: texto marcado na leitura, caixa de texto na edição.
      const set = (caminho, valor) => {
        const novo = JSON.parse(JSON.stringify(rasc));
        if (caminho === 'legenda') novo.legenda = valor;
        else {
          const ks = caminho.split('.');
          let o = novo.conteudo;
          ks.slice(0, -1).forEach((k) => { o = o[k]; });
          o[ks[ks.length - 1]] = valor;
        }
        setRasc(novo);
      };
      const F = (texto, campo, grande) => (editando
        ? <TextoEditavel valor={texto} grande={grande} onChange={(v) => set(campo, v)} />
        : <TextoMarcado texto={texto} campo={campo} pendentes={pend} />);
      const R = (alvo, rotulo) => (editavel && !editando ? <Regerar uid={uid} roteiroId={r.id} alvo={alvo} rotulo={rotulo} ocupado={ocupado} setOcupado={setOcupado} /> : null);

      function comecarEdicao() {
        setRasc({ conteudo: JSON.parse(JSON.stringify(r.conteudo)), legenda: r.legenda || '' });
        setEditando(true);
      }
      async function salvarEdicao() {
        setSalvando(true);
        try {
          const versoes = [...(r.versoes || []), { conteudo: rasc.conteudo, legenda: rasc.legenda, editadoPor: 'cliente', em: firebase.firestore.Timestamp.now() }].slice(-10);
          await db.doc(`clientes/${uid}/roteiros/${r.id}`).update({ conteudo: rasc.conteudo, legenda: rasc.legenda, versoes, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() });
          setEditando(false);
          toast('Alterações salvas.');
        } catch (e) {
          toast(mensagemErro(e));
        }
        setSalvando(false);
      }
      async function restaurar(v) {
        try {
          const versoes = [...(r.versoes || []), { conteudo: v.conteudo, legenda: v.legenda, editadoPor: 'cliente', restauradaDe: v.em || null, em: firebase.firestore.Timestamp.now() }].slice(-10);
          await db.doc(`clientes/${uid}/roteiros/${r.id}`).update({ conteudo: v.conteudo, legenda: v.legenda, versoes, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() });
          setHistorico(false);
          toast('Versão restaurada.');
        } catch (e) {
          toast(mensagemErro(e));
        }
      }
      async function alternarPronto() {
        try {
          await db.doc(`clientes/${uid}/roteiros/${r.id}`).update({ status: r.status === 'pronto' ? 'rascunho' : 'pronto' });
        } catch (e) { toast(mensagemErro(e)); }
      }
      async function excluir() {
        if (!confirm('Excluir este roteiro? Não dá para desfazer.')) return;
        try {
          await db.doc(`clientes/${uid}/roteiros/${r.id}`).delete();
          toast('Roteiro excluído.');
          onVoltar();
        } catch (e) { toast(mensagemErro(e)); }
      }
      async function gerarProxima() {
        setGerandoParte(true);
        try {
          const nova = await chamar('gerarRoteiro', { continuarSerie: r.serieId }, { timeout: 540000 });
          onAbrir(nova.id);
        } catch (e) {
          toast(mensagemErro(e));
        }
        setGerandoParte(false);
      }

      const STATUS = { rascunho: 'Rascunho', pronto: 'Pronto para gravar', postado: 'Postado', medido: 'Medido' };
      return (
        <>
          <Cabecalho>
            {!editando && <button className="btn fantasma mini" onClick={() => setHistorico(true)}>Histórico</button>}
            <button className="btn fantasma mini" onClick={() => (editando ? setEditando(false) : onVoltar())}>{editando ? 'Cancelar edição' : 'Voltar'}</button>
          </Cabecalho>
          <main className={'wrap conteudo estreito stack-lg' + (editando ? ' modo-edicao' : '')}>
            <div className="stack">
              <span className="sobretitulo">{FORMATOS[r.formato]}{c.nomeSerie ? ` · ${c.nomeSerie} · parte ${r.parteSerie} de ${c.totalPartes}` : ''}</span>
              <h1>{r.tema}</h1>
              <div className="etiquetas-roteiro">
                <span className={'status-' + r.status}>{STATUS[r.status]}</span>
                <span>{PILARES[r.pilar]?.nome}</span><span>{ESTILOS[r.estilo]}</span><span>{ANGULOS[r.angulo]}</span><span>{r.framework}</span>
                {r.editoria && <span>{r.editoria}</span>}
                {r.formatoVisual && <span>{FORMATOS_VISUAIS[r.formatoVisual]}</span>}
                {r.duracaoEstimadaSeg ? <span>cerca de {r.duracaoEstimadaSeg}s</span> : null}
              </div>
              {editando && <div className="aviso">Modo de edição: mude o que quiser com as suas palavras e toque em "Salvar alterações". O que você escreve não passa pela trava.</div>}
            </div>

            {!editando && (r.avisos || []).map((a) => <div className="aviso" key={a}>{a}</div>)}
            {!editando && temMarcaAtiva(r) && (
              <div className="aviso">
                <strong>Tem trecho marcado com cara de IA.</strong> Reescreva com as suas palavras (botão "Editar") ou regere o bloco antes de gravar ou postar.
              </div>
            )}

            {c.bigIdea !== undefined && (
              <section className="ideia">
                <span className="sobretitulo">Ideia central</span>
                <p>{F(c.bigIdea, 'bigIdea', true)}</p>
              </section>
            )}

            {c.blocos && (
              <section className="stack">
                <div className="legenda-cores"><span className="cor-fala">Falar</span><span className="cor-visual">Mostrar</span><span className="cor-tela">Texto na tela</span></div>
                {c.blocos.map((b, i) => (
                  <article className={'bloco' + (ocupado === `blocos.${i}` ? ' regerando' : '')} key={i}>
                    <header><strong>{TIPOS_BLOCO[b.tipo] || b.tipo}</strong><span className="num">{b.tempo}</span></header>
                    <div className="fala">{F(b.fala, `blocos.${i}.fala`)}</div>
                    <div className="visual">{F(b.visual, `blocos.${i}.visual`)}</div>
                    {(b.textoTela || editando) && <div className="na-tela">{F(b.textoTela, `blocos.${i}.textoTela`)}</div>}
                    {R(`blocos.${i}`, TIPOS_BLOCO[b.tipo] || 'Bloco')}
                  </article>
                ))}
              </section>
            )}

            {c.slides && (
              <section className="stack">
                {c.slides.map((sl, i) => (
                  <article className={'bloco' + (ocupado === `slides.${i}` ? ' regerando' : '')} key={i}>
                    <header><strong>Slide {sl.n}</strong>{i === 0 && <span>capa</span>}{i === c.slides.length - 1 && <span>CTA</span>}</header>
                    <div className="fala">{F(sl.texto, `slides.${i}.texto`)}</div>
                    <div className="visual">{F(sl.visual, `slides.${i}.visual`)}</div>
                    {R(`slides.${i}`, `Slide ${sl.n}`)}
                  </article>
                ))}
              </section>
            )}

            {c.arte && (
              <article className={'bloco' + (ocupado === 'arte' ? ' regerando' : '')}>
                <header><strong>Arte</strong></header>
                <div className="fala titulo-arte">{F(c.arte.headline, 'arte.headline')}</div>
                <div className="fala">{F(c.arte.apoio, 'arte.apoio')}</div>
                <div className="visual">{F(c.arte.visual, 'arte.visual')}</div>
                {R('arte', 'Arte')}
              </article>
            )}

            {c.frames && (
              <section className="stack">
                {c.objetivoSequencia !== undefined && <div className="suave">{F(c.objetivoSequencia, 'objetivoSequencia')}</div>}
                {c.frames.map((f, i) => (
                  <article className={'bloco' + (ocupado === `frames.${i}` ? ' regerando' : '')} key={i}>
                    <header><strong>Frame {f.n}</strong><span>{TIPOS_FRAME[f.tipo] || f.tipo}</span></header>
                    <div className="fala">{F(f.conteudo, `frames.${i}.conteudo`)}</div>
                    <div className="visual">{F(f.visual, `frames.${i}.visual`)}</div>
                    {(f.interacao || editando) && <div className="na-tela">{F(f.interacao, `frames.${i}.interacao`)}</div>}
                    {R(`frames.${i}`, `Frame ${f.n}`)}
                  </article>
                ))}
              </section>
            )}

            {c.ganchos?.length > 0 && (
              <section className="cartao">
                <div className="faixa" />
                <div className="cartao-corpo stack">
                  <span className="sobretitulo">Teste de ganchos</span>
                  <h2>5 ganchos para testar</h2>
                  <p className="suave peq">
                    {['reels', 'serie'].includes(r.formato)
                      ? 'Grave o vídeo inteiro com o gancho 1. Depois grave só os 3 primeiros segundos com cada um dos outros e publique as 5 versões como Reels de teste.'
                      : r.formato === 'carrossel' ? 'São 5 capas diferentes para o slide 1. Teste uma por vez e mude só a capa.' : 'São 5 headlines diferentes. Teste uma por vez e mude só a headline.'}
                  </p>
                  {c.ganchos.map((g, i) => (
                    <div className={'gancho' + (ocupado === `ganchos.${i}` ? ' regerando' : '')} key={i}>
                      <div className="gancho-n">{g.n}</div>
                      <div className="gancho-corpo">
                        <span className="sobretitulo">{TIPOS_GANCHO[g.tipo] || g.tipo}</span>
                        <div className="fala">{F(g.texto, `ganchos.${i}.texto`)}</div>
                        {(g.textoTela || editando) && <div className="na-tela">{F(g.textoTela, `ganchos.${i}.textoTela`)}</div>}
                        {(g.visual || editando) && <div className="visual">{F(g.visual, `ganchos.${i}.visual`)}</div>}
                        {!editando && (
                          <div className="linha">
                            <button type="button" className="btn mini" onClick={() => copiarTexto(g.texto, `Gancho ${g.n} copiado.`)}>Copiar gancho {g.n}</button>
                            {R(`ganchos.${i}`, `Gancho ${g.n}`)}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {c.angulosParaTestar?.length > 0 && !editando && (
              <section className="stack">
                <h3>Mesma história, outros ângulos</h3>
                <p className="suave peq">Para os próximos testes. Mude só o ângulo e mantenha o resto, assim você sabe o que fez diferença.</p>
                <ul className="regras">
                  {c.angulosParaTestar.map((a, i) => (
                    <li key={i}><strong>{ANGULOS[a.angulo] || a.angulo}.</strong> <TextoMarcado texto={a.ideia} campo={`angulosParaTestar.${i}.ideia`} pendentes={pend} /></li>
                  ))}
                </ul>
              </section>
            )}

            {(legenda || editando) && (
              <section className={'stack' + (ocupado === 'legenda' ? ' regerando' : '')}>
                <div className="entre"><h3>Legenda</h3>{!editando && <button className="btn mini" onClick={() => copiarTexto(r.legenda, 'Legenda copiada.')}>Copiar legenda</button>}</div>
                <div className="legenda-texto">{F(legenda, 'legenda')}</div>
                {R('legenda', 'Legenda')}
              </section>
            )}

            {(c.notaProducao || (editando && c.notaProducao !== undefined)) && <div className="nota"><span className="sobretitulo">Nota de produção</span><div>{F(c.notaProducao, 'notaProducao')}</div></div>}

            {!editando && editavel && (
              <div className="linha" style={{ justifyContent: 'space-between' }}>
                <label className="interruptor">
                  <input type="checkbox" checked={r.status === 'pronto'} onChange={alternarPronto} />
                  <span>Pronto para gravar</span>
                </label>
                <button className="btn texto peq" style={{ color: 'var(--vermelho)' }} onClick={excluir}>Excluir roteiro</button>
              </div>
            )}

            <div className="barra-acoes">
              {editando ? (
                <>
                  <button className="btn" onClick={() => setEditando(false)} disabled={salvando}>Cancelar</button>
                  <button className="btn primario" onClick={salvarEdicao} disabled={salvando}>{salvando ? <><span className="girando" /> Salvando...</> : 'Salvar alterações'}</button>
                </>
              ) : (
                <>
                  {proximaParte && (
                    <button className="btn" onClick={gerarProxima} disabled={gerandoParte}>
                      {gerandoParte ? <><span className="girando" /> Escrevendo a parte {proximaParte}...</> : `Gerar parte ${proximaParte}`}
                    </button>
                  )}
                  {editavel && <button className="btn" onClick={comecarEdicao} disabled={!!ocupado}>Editar</button>}
                  {editavel && <button className="btn" onClick={() => setPostando(true)} disabled={!!ocupado}>Marcar como postado</button>}
                  {r.postId && <button className="btn" onClick={() => onAbrirPost(r.postId)}>{r.status === 'medido' ? 'Ver diagnóstico' : 'Preencher resultado'}</button>}
                  <button className="btn primario" onClick={() => copiarTexto(roteiroParaTexto(r), 'Roteiro copiado.')}>Copiar roteiro</button>
                </>
              )}
            </div>
          </main>
          {historico && <Historico r={r} onRestaurar={restaurar} onFechar={() => setHistorico(false)} />}
          {postando && <MarcarPostado r={r} onFechar={() => setPostando(false)} onPostado={() => { setPostando(false); toast('Marcado como postado. A plataforma vai te lembrar de anotar os resultados.'); }} />}
        </>
      );
    }

    // ---------- biblioteca "Meus roteiros" ----------
    function MeusRoteiros({ uid, onAbrir, onVoltar }) {
      const [lista, setLista] = useState(null);
      const [ultimo, setUltimo] = useState(null);
      const [acabou, setAcabou] = useState(false);
      const [carregando, setCarregando] = useState(false);
      const [filtro, setFiltro] = useState({ formato: '', pilar: '', status: '', busca: '' });
      const POR_PAGINA = 50;

      async function carregar(depois) {
        setCarregando(true);
        try {
          let q = db.collection(`clientes/${uid}/roteiros`).orderBy('criadoEm', 'desc').limit(POR_PAGINA);
          if (depois) q = q.startAfter(depois);
          const snap = await q.get();
          const novos = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          setLista((l) => [...(depois ? l || [] : []), ...novos]);
          setUltimo(snap.docs[snap.docs.length - 1] || null);
          setAcabou(snap.docs.length < POR_PAGINA);
        } catch (e) {
          toast(mensagemErro(e));
          setLista((l) => l || []);
        }
        setCarregando(false);
      }
      useEffect(() => { carregar(null); }, [uid]);

      const STATUS = { rascunho: 'Rascunho', pronto: 'Pronto para gravar', postado: 'Postado', medido: 'Medido' };
      const q = filtro.busca.trim().toLowerCase();
      const visiveis = (lista || []).filter((r) =>
        (!filtro.formato || r.formato === filtro.formato) && (!filtro.pilar || r.pilar === filtro.pilar) &&
        (!filtro.status || r.status === filtro.status) && (!q || (r.tema || '').toLowerCase().includes(q)));
      const muda = (k) => (e) => setFiltro({ ...filtro, [k]: e.target.value });

      return (
        <>
          <Cabecalho><button className="btn fantasma mini" onClick={onVoltar}>Voltar</button></Cabecalho>
          <main className="wrap conteudo stack-lg">
            <div className="stack">
              <span className="sobretitulo">Biblioteca</span>
              <h1>Meus roteiros</h1>
            </div>
            <div className="filtros-biblioteca">
              <input placeholder="Buscar pelo tema" value={filtro.busca} onChange={muda('busca')} aria-label="Buscar pelo tema" />
              <select value={filtro.formato} onChange={muda('formato')} aria-label="Formato"><option value="">Todos os formatos</option>{Object.entries(FORMATOS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select>
              <select value={filtro.pilar} onChange={muda('pilar')} aria-label="Pilar"><option value="">Todos os pilares</option>{Object.entries(PILARES).map(([k, v]) => <option key={k} value={k}>{v.nome}</option>)}</select>
              <select value={filtro.status} onChange={muda('status')} aria-label="Status"><option value="">Todos os status</option>{Object.entries(STATUS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select>
            </div>
            {!lista && <div className="linha suave"><span className="girando" /> Carregando roteiros...</div>}
            {lista && !visiveis.length && <div className="cartao vazio"><h3>Nada por aqui</h3><p className="suave">{lista.length ? 'Nenhum roteiro com esse filtro.' : 'Você ainda não criou roteiros.'}</p></div>}
            <div className="lista-roteiros">
              {visiveis.map((r) => (
                <button type="button" key={r.id} className="item-roteiro" onClick={() => onAbrir(r.id)}>
                  <span className="sobretitulo">{FORMATOS[r.formato]} · {r.pilar}{r.parteSerie ? ` · parte ${r.parteSerie}` : ''} · {dataHora(r.criadoEm)}</span>
                  <strong>{r.tema}</strong>
                  <span className="linha" style={{ gap: 6 }}>
                    <span className={'selo ' + (r.status === 'pronto' ? 'ativo' : r.status === 'rascunho' ? 'testes' : 'vencedor')}>{STATUS[r.status]}</span>
                    {temMarcaAtiva(r) && <span className="selo alerta">trechos para revisar</span>}
                  </span>
                </button>
              ))}
            </div>
            {lista && !acabou && <button className="btn" onClick={() => carregar(ultimo)} disabled={carregando}>{carregando ? <><span className="girando" /> Carregando...</> : 'Carregar mais'}</button>}
          </main>
        </>
      );
    }

    function RoteirosRecentes({ uid, onAbrir, onVerTodos }) {
      const [lista, setLista] = useState(null);
      useEffect(() => db.collection(`clientes/${uid}/roteiros`).orderBy('criadoEm', 'desc').limit(8).onSnapshot(
        (s) => setLista(s.docs.map((d) => ({ id: d.id, ...d.data() }))), () => setLista([])
      ), [uid]);
      if (!lista?.length) return null;
      return (
        <section className="stack">
          <div className="entre"><h2>Seus últimos roteiros</h2><button className="btn mini" onClick={onVerTodos}>Ver todos</button></div>
          <div className="lista-roteiros">
            {lista.map((r) => (
              <button type="button" key={r.id} className="item-roteiro" onClick={() => onAbrir(r.id)}>
                <span className="sobretitulo">{FORMATOS[r.formato]} · {r.pilar}{r.parteSerie ? ` · parte ${r.parteSerie}` : ''}</span>
                <strong>{r.tema}</strong>
                {temMarcaAtiva(r) && <span className="selo alerta">trechos para revisar</span>}
              </button>
            ))}
          </div>
        </section>
      );
    }

    // ==========================================================
    // Produtos, foco do mês e estratégia do cliente
    // ==========================================================
    const limparProdutos = (lista) => (lista || [])
      .map((p) => ({ nome: (p.nome || '').trim(), preco: (p.preco || '').trim(), descricao: (p.descricao || '').trim(), paraQuem: (p.paraQuem || '').trim() }))
      .filter((p) => p.nome);

    function CamposProdutos({ d, set }) {
      const produtos = d.produtos?.length ? d.produtos : [{ nome: '', preco: '', descricao: '', paraQuem: '' }];
      const mudar = (lista) => set({ ...d, produtos: lista });
      const campo = (i, k) => (ev) => mudar(produtos.map((p, j) => (j === i ? { ...p, [k]: ev.target.value } : p)));
      return (
        <div className="stack">
          {produtos.map((p, i) => (
            <div className="produto" key={i}>
              <div className="entre">
                <span className="sobretitulo">Produto {i + 1}</span>
                {produtos.length > 1 && <button type="button" className="btn texto peq" onClick={() => mudar(produtos.filter((_, j) => j !== i))}>Remover</button>}
              </div>
              <div className="duas">
                <div>
                  <label htmlFor={`p-nome-${i}`}>Nome</label>
                  <input id={`p-nome-${i}`} placeholder="Ex.: Kit festa 30 potes" value={p.nome || ''} onChange={campo(i, 'nome')} />
                </div>
                <div>
                  <label htmlFor={`p-preco-${i}`}>Preço <span className="suave">(opcional)</span></label>
                  <input id={`p-preco-${i}`} placeholder="Ex.: R$ 270" value={p.preco || ''} onChange={campo(i, 'preco')} />
                </div>
              </div>
              <div>
                <label htmlFor={`p-desc-${i}`}>O que é <span className="suave">(opcional)</span></label>
                <input id={`p-desc-${i}`} placeholder="Ex.: 30 bolos de pote sortidos, entrega no mesmo dia" value={p.descricao || ''} onChange={campo(i, 'descricao')} />
              </div>
              <div>
                <label htmlFor={`p-quem-${i}`}>Para quem <span className="suave">(opcional)</span></label>
                <input id={`p-quem-${i}`} placeholder="Ex.: festas de até 30 pessoas" value={p.paraQuem || ''} onChange={campo(i, 'paraQuem')} />
              </div>
            </div>
          ))}
          {produtos.length < 30 && <button type="button" className="btn" onClick={() => mudar([...produtos, { nome: '', preco: '', descricao: '', paraQuem: '' }])}>Adicionar outro produto</button>}
        </div>
      );
    }

    function useDoc(caminho) {
      const [v, setV] = useState(undefined);
      useEffect(() => {
        if (!caminho) return;
        return db.doc(caminho).onSnapshot((s) => setV(s.exists ? s.data() : null), () => setV(null));
      }, [caminho]);
      return v;
    }

    function nomeDoMesRef(mes) {
      return new Intl.DateTimeFormat('pt-BR', { month: 'long', timeZone: FUSO }).format(new Date(`${mes}-15T12:00:00-03:00`));
    }
    const dataBR = (iso) => (iso ? iso.split('-').reverse().join('/') : '');
    const hojeISO = () => new Intl.DateTimeFormat('en-CA', { timeZone: FUSO }).format(new Date());
    const campanhaVigente = (foco) => (foco?.campanha?.ativa && foco.campanha.nome && !(foco.campanha.fim && foco.campanha.fim < hojeISO()) ? foco.campanha : null);
    const CAMPANHA_VAZIA = { ativa: false, nome: '', oferta: '', mecanica: '', regras: '', inicio: '', fim: '', comoParticipar: '', cta: '' };

    function FormFoco({ uid, produtos = [], quem, cliente, onVoltar }) {
      const mes = mesReferencia();
      const [f, setF] = useState(null);
      const [veioDoAnterior, setVeioDoAnterior] = useState(null);
      const [salvando, setSalvando] = useState(false);
      const [erro, setErro] = useState('');

      useEffect(() => {
        (async () => {
          const atual = await db.doc(`clientes/${uid}/focos/${mes}`).get().catch(() => null);
          if (atual?.exists) return setF({ ...atual.data(), campanha: { ...CAMPANHA_VAZIA, ...(atual.data().campanha || {}) } });
          // Pré-preenche com o último foco salvo.
          const ant = await db.collection(`clientes/${uid}/focos`).orderBy(firebase.firestore.FieldPath.documentId(), 'desc').limit(3).get().catch(() => null);
          const doc = ant?.docs.find((d) => d.id < mes);
          if (doc) {
            setVeioDoAnterior(doc.id);
            const c = { ...CAMPANHA_VAZIA, ...(doc.data().campanha || {}) };
            // Campanha que já acabou não vem marcada.
            if (c.fim && c.fim < hojeISO()) c.ativa = false;
            return setF({ objetivoPerfil: doc.data().objetivoPerfil || '', produtoFoco: doc.data().produtoFoco || '', objetivo: doc.data().objetivo || '', campanha: c });
          }
          setF({ objetivoPerfil: '', produtoFoco: produtos[0]?.nome || '', objetivo: '', campanha: { ...CAMPANHA_VAZIA } });
        })();
      }, [uid, mes]);

      if (!f) return <Carregando />;
      const c = f.campanha;
      const mudarC = (k) => (ev) => setF({ ...f, campanha: { ...c, [k]: ev.target.value } });
      const nomes = produtos.map((p) => p.nome);
      const outro = f.produtoFoco && !nomes.includes(f.produtoFoco);

      async function salvar() {
        setErro('');
        if (!OBJETIVOS_PERFIL[f.objetivoPerfil]) return setErro('Escolha o objetivo do perfil neste mês.');
        if (!f.produtoFoco?.trim() && !f.objetivo?.trim()) return setErro('Escolha o produto em destaque ou escreva o objetivo do mês.');
        if (c.ativa && !c.nome?.trim()) return setErro('Dê um nome para a campanha.');
        if (c.ativa && !c.mecanica?.trim()) return setErro('Explique a mecânica da campanha: é ela que os roteiros vão usar.');
        if (c.inicio && c.fim && c.fim < c.inicio) return setErro('A data de fim da campanha está antes do início.');
        setSalvando(true);
        try {
          await db.doc(`clientes/${uid}/focos/${mes}`).set({
            objetivoPerfil: f.objetivoPerfil,
            produtoFoco: (f.produtoFoco || '').trim(),
            objetivo: (f.objetivo || '').trim(),
            campanha: c.ativa ? Object.fromEntries(Object.entries(c).map(([k, v]) => [k, typeof v === 'string' ? v.trim() : v])) : { ...CAMPANHA_VAZIA },
            atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(),
            atualizadoPor: quem,
          });
          toast(`Foco de ${nomeDoMesRef(mes)} salvo.`);
          onVoltar();
        } catch (e) {
          setErro(mensagemErro(e));
        }
        setSalvando(false);
      }

      return (
        <>
          <Cabecalho><button className="btn fantasma mini" onClick={onVoltar}>Voltar</button></Cabecalho>
          <main className="wrap conteudo estreito stack-lg">
            <div className="stack">
              <span className="sobretitulo">Foco do mês</span>
              <h1>Qual seu principal objetivo em {nomeDoMesRef(mes)}?</h1>
              <p className="suave">O foco muda o CTA e o assunto dos roteiros de venda. Defina todo mês, mesmo que repita o anterior.</p>
              {veioDoAnterior && <div className="aviso">Trouxe o foco de {nomeDoMesRef(veioDoAnterior)} para você ajustar. Confira antes de salvar.</div>}
            </div>
            <section className="cartao"><div className="cartao-corpo stack">
              <h2>Objetivo do perfil</h2>
              <p className="suave peq">Ele define a mistura de posts do mês: quanto de atração, de venda e de fidelização.</p>
              <Opcoes valor={f.objetivoPerfil} onEscolher={(v) => setF({ ...f, objetivoPerfil: v })}
                opcoes={Object.entries(OBJETIVOS_PERFIL).map(([id, o]) => {
                  const m = mixDoCliente(id, cliente);
                  return { id, titulo: o.nome, texto: o.descricao, selo: `P1 ${m.P1}% · P2 ${m.P2}% · P3 ${m.P3}%` };
                })} />
            </div></section>

            <section className="cartao"><div className="cartao-corpo stack">
              <h2>Destaque do mês</h2>
              <div>
                <label htmlFor="foco-produto">Produto em destaque</label>
                <select id="foco-produto" value={outro ? '__outro' : (f.produtoFoco || '')} onChange={(ev) => setF({ ...f, produtoFoco: ev.target.value === '__outro' ? ' ' : ev.target.value })}>
                  <option value="">Nenhum em especial</option>
                  {nomes.map((n) => <option key={n} value={n}>{n}</option>)}
                  <option value="__outro">Outro</option>
                </select>
                {outro && <input style={{ marginTop: 8 }} placeholder="Nome do produto ou serviço" value={f.produtoFoco.trimStart()} onChange={(ev) => setF({ ...f, produtoFoco: ev.target.value })} />}
              </div>
              <div>
                <label htmlFor="foco-objetivo">Objetivo do mês</label>
                <textarea id="foco-objetivo" rows="3" placeholder="Ex.: vender 40 kits para festas de fim de ano e abrir a agenda de janeiro" value={f.objetivo || ''} onChange={(ev) => setF({ ...f, objetivo: ev.target.value })} />
              </div>
            </div></section>

            <section className="cartao"><div className="cartao-corpo stack">
              <div className="entre">
                <h2>Campanha</h2>
                <label className="interruptor">
                  <input type="checkbox" checked={!!c.ativa} onChange={(ev) => setF({ ...f, campanha: { ...c, ativa: ev.target.checked } })} />
                  <span>{c.ativa ? 'Tem campanha este mês' : 'Sem campanha'}</span>
                </label>
              </div>
              {c.ativa && (
                <>
                  <div>
                    <label htmlFor="c-nome">Nome da campanha</label>
                    <input id="c-nome" placeholder="Ex.: Natal sem estresse" value={c.nome} onChange={mudarC('nome')} />
                  </div>
                  <div>
                    <label htmlFor="c-oferta">Oferta</label>
                    <input id="c-oferta" placeholder="Ex.: kit com 10% de desconto e frete grátis" value={c.oferta} onChange={mudarC('oferta')} />
                  </div>
                  <div>
                    <label htmlFor="c-mecanica">Mecânica</label>
                    <textarea id="c-mecanica" rows="4" placeholder="Como a campanha funciona. Ex.: quem fechar o kit até dia 10 ganha 5 potes extras; depois disso vale só o frete grátis." value={c.mecanica} onChange={mudarC('mecanica')} />
                  </div>
                  <div>
                    <label htmlFor="c-regras">Regras e condições <span className="suave">(opcional)</span></label>
                    <textarea id="c-regras" rows="2" placeholder="Ex.: pedidos com 48h de antecedência, só Campinas" value={c.regras} onChange={mudarC('regras')} />
                  </div>
                  <div className="duas">
                    <div><label htmlFor="c-inicio">Começa em</label><input id="c-inicio" type="date" value={c.inicio} onChange={mudarC('inicio')} /></div>
                    <div><label htmlFor="c-fim">Termina em</label><input id="c-fim" type="date" value={c.fim} onChange={mudarC('fim')} /></div>
                  </div>
                  <div>
                    <label htmlFor="c-como">Como participar</label>
                    <input id="c-como" placeholder="Ex.: chamar no WhatsApp com a palavra NATAL" value={c.comoParticipar} onChange={mudarC('comoParticipar')} />
                  </div>
                  <div>
                    <label htmlFor="c-cta">Chamada da campanha (CTA)</label>
                    <input id="c-cta" placeholder="Ex.: Comenta NATAL que eu te mando o cardápio" value={c.cta} onChange={mudarC('cta')} />
                    <p className="dica">Depois da data de fim, a campanha sai dos roteiros sozinha.</p>
                  </div>
                </>
              )}
            </div></section>
            {erro && <div className="erro" role="alert">{erro}</div>}
            <div className="barra-acoes">
              <button className="btn" onClick={onVoltar} disabled={salvando}>Cancelar</button>
              <button className="btn primario" onClick={salvar} disabled={salvando}>{salvando ? <><span className="girando" /> Salvando...</> : 'Salvar foco do mês'}</button>
            </div>
          </main>
        </>
      );
    }

    function CartaoFoco({ foco, onEditar, mix, contagem }) {
      const mes = mesReferencia();
      if (foco === undefined) return null;
      if (!foco) {
        return (
          <section className="cartao foco-vazio">
            <div className="cartao-corpo entre">
              <div style={{ minWidth: 0, flex: '1 1 260px' }}>
                <span className="sobretitulo">Foco de {nomeDoMesRef(mes)}</span>
                <h3 style={{ marginTop: 6 }}>Defina o que você vai vender este mês</h3>
                <p className="suave peq" style={{ marginTop: 4 }}>Produto em destaque e campanha, se tiver. Os roteiros de venda usam isso para mudar o assunto e o CTA.</p>
              </div>
              <button className="btn primario" onClick={onEditar}>Definir foco</button>
            </div>
          </section>
        );
      }
      const c = campanhaVigente(foco);
      return (
        <section className="cartao">
          <div className="cartao-corpo stack">
            <div className="entre">
              <span className="sobretitulo">Foco de {nomeDoMesRef(mes)}</span>
              <button className="btn mini" onClick={onEditar}>Editar</button>
            </div>
            {OBJETIVOS_PERFIL[foco.objetivoPerfil] && <p className="objetivo-perfil">{OBJETIVOS_PERFIL[foco.objetivoPerfil].nome}</p>}
            {foco.produtoFoco && <h3>{foco.produtoFoco}</h3>}
            {foco.objetivo && <p className="suave">{foco.objetivo}</p>}
            {c && (
              <div className="campanha">
                <span className="sobretitulo">Campanha ativa{c.fim ? ` até ${dataBR(c.fim)}` : ''}</span>
                <strong>{c.nome}</strong>
                {c.oferta && <p>{c.oferta}</p>}
                {c.mecanica && <p className="suave peq">{c.mecanica}</p>}
              </div>
            )}
            {mix && (
              <div className="stack">
                <span className="sobretitulo">Mistura do mês</span>
                <MisturaDoMes mix={mix} contagem={contagem} />
              </div>
            )}
            {!mix && <p className="peq suave">Escolha o objetivo do perfil no foco para ver a mistura de posts do mês.</p>}
          </div>
        </section>
      );
    }

    function LembreteMarca({ estrategia }) {
      if (!estrategia) return null;
      const b = estrategia.branding || {};
      const temAlgo = b.posicionamento || b.promessa || b.personalidade || estrategia.editorias?.length;
      if (!temAlgo) return null;
      return (
        <section className="cartao marca-lembrete">
          <div className="faixa" />
          <div className="cartao-corpo stack">
            <span className="sobretitulo">Sua marca · definida com a Visions</span>
            {b.posicionamento && <p className="posicionamento">{b.posicionamento}</p>}
            <dl className="dados">
              {b.promessa && <><dt>Promessa</dt><dd>{b.promessa}</dd></>}
              {b.personalidade && <><dt>Personalidade</dt><dd>{b.personalidade}</dd></>}
              {b.valores?.length > 0 && <><dt>Valores</dt><dd>{b.valores.join(', ')}</dd></>}
              {estrategia.formatosPrioritarios?.length > 0 && <><dt>Formatos prioritários</dt><dd>{estrategia.formatosPrioritarios.map((f) => FORMATOS[f]).join(', ')}</dd></>}
            </dl>
            {estrategia.editorias?.length > 0 && (
              <div>
                <span className="sobretitulo">Suas editorias</span>
                <div className="chips" style={{ marginTop: 8 }}>{estrategia.editorias.map((e) => <span className="chip sem-x" key={e.nome} title={e.descricao}>{e.nome}{e.pilar ? ` · ${e.pilar}` : ''}</span>)}</div>
              </div>
            )}
            {b.naoFazer?.length > 0 && <p className="peq suave"><strong style={{ color: 'var(--tinta-2)' }}>Evite:</strong> {b.naoFazer.join('; ')}.</p>}
          </div>
        </section>
      );
    }

    // ---------- admin: estratégia do cliente ----------
    const ESTRATEGIA_VAZIA = { planoDeAcao: '', branding: { posicionamento: '', promessa: '', personalidade: '', valores: [], naoFazer: [] }, editorias: [], formatosPrioritarios: [], observacaoFormatos: '' };

    function EstrategiaCliente({ cliente, onVoltar }) {
      const uid = cliente.id;
      const salvo = useDoc(`clientes/${uid}/estrategia/atual`);
      const dnaSalvo = useDoc(`clientes/${uid}/dna/atual`);
      const foco = useDoc(`clientes/${uid}/focos/${mesReferencia()}`);
      const [e, setE] = useState(null);
      const [prod, setProd] = useState(null);
      const [sugeridos, setSugeridos] = useState(null);
      const [pendencias, setPendencias] = useState([]);
      const [organizando, setOrganizando] = useState(false);
      const [salvando, setSalvando] = useState(false);
      const [erro, setErro] = useState('');
      const [tela, setTela] = useState('estrategia');

      useEffect(() => { if (salvo !== undefined && !e) setE({ ...ESTRATEGIA_VAZIA, ...(salvo || {}), branding: { ...ESTRATEGIA_VAZIA.branding, ...(salvo?.branding || {}) } }); }, [salvo]);
      useEffect(() => { if (dnaSalvo !== undefined && !prod) setProd({ produtos: dnaSalvo?.produtos || [] }); }, [dnaSalvo]);
      if (!e || !prod) return <Carregando />;
      if (tela === 'foco') return <FormFoco uid={uid} produtos={limparProdutos(prod.produtos)} quem="admin" cliente={cliente} onVoltar={() => setTela('estrategia')} />;

      const b = e.branding;
      const mudarB = (k) => (ev) => setE({ ...e, branding: { ...b, [k]: ev.target.value } });

      async function organizar() {
        setErro('');
        setOrganizando(true);
        try {
          const r = await chamar('adminExtrairEstrategia', { plano: e.planoDeAcao }, { timeout: 300000 });
          const x = r.estrategia;
          setE({ ...e, branding: { ...ESTRATEGIA_VAZIA.branding, ...x.branding }, editorias: x.editorias, formatosPrioritarios: x.formatosPrioritarios, observacaoFormatos: x.observacaoFormatos });
          setSugeridos(x.produtos?.length ? x.produtos : null);
          setPendencias(r.pendencias || []);
          toast('Plano organizado. Revise os campos e salve.');
        } catch (err) {
          setErro(mensagemErro(err));
        }
        setOrganizando(false);
      }

      async function salvar() {
        setErro('');
        setSalvando(true);
        try {
          await db.doc(`clientes/${uid}/estrategia/atual`).set({
            planoDeAcao: e.planoDeAcao || '',
            branding: { ...b, posicionamento: b.posicionamento.trim(), promessa: b.promessa.trim(), personalidade: b.personalidade.trim() },
            editorias: e.editorias.map((x) => ({ nome: x.nome.trim(), descricao: (x.descricao || '').trim(), pilar: x.pilar || '' })).filter((x) => x.nome),
            formatosPrioritarios: e.formatosPrioritarios,
            observacaoFormatos: (e.observacaoFormatos || '').trim(),
            atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(),
          });
          const produtos = limparProdutos(prod.produtos);
          if (JSON.stringify(produtos) !== JSON.stringify(limparProdutos(dnaSalvo?.produtos))) {
            await db.doc(`clientes/${uid}/dna/atual`).set({ produtos, atualizadoEm: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          }
          toast('Estratégia salva.');
          onVoltar();
        } catch (err) {
          setErro(mensagemErro(err));
        }
        setSalvando(false);
      }

      const fc = campanhaVigente(foco);
      return (
        <>
          <Cabecalho rotulo="Admin"><button className="btn fantasma mini" onClick={onVoltar}>Voltar</button></Cabecalho>
          <main className="wrap conteudo estreito stack-lg">
            <div className="stack">
              <span className="sobretitulo">Estratégia</span>
              <h1>{cliente.nome}</h1>
              <p className="suave">Tudo aqui entra nos roteiros. O cliente vê o branding, as editorias e os formatos como lembrete, sem poder editar.</p>
            </div>

            <section className="cartao"><div className="cartao-corpo stack">
              <h2>Plano de ação</h2>
              <p className="suave peq">Cole o plano de ação do cliente. A IA organiza o branding, as editorias, os formatos e os produtos nos campos abaixo para você revisar.</p>
              <textarea rows="10" value={e.planoDeAcao} placeholder="Cole aqui o plano de ação completo" onChange={(ev) => setE({ ...e, planoDeAcao: ev.target.value })} />
              <div className="entre">
                <span className="dica num">{(e.planoDeAcao || '').length.toLocaleString('pt-BR')} de 60.000 caracteres</span>
                <button className="btn" onClick={organizar} disabled={organizando || (e.planoDeAcao || '').trim().length < 200}>
                  {organizando ? <><span className="girando" /> Lendo o plano...</> : 'Organizar com IA'}
                </button>
              </div>
              {pendencias.length > 0 && <div className="aviso">A IA deixou {pendencias.length} trecho(s) com cara de IA: {pendencias.map((p) => `"${p.trecho}"`).join(', ')}. Ajuste antes de salvar.</div>}
            </div></section>

            <section className="cartao"><div className="cartao-corpo stack">
